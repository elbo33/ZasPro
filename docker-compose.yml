# Local Postgres 16 for development and tests (SPEC M1 / §3).
# `docker compose up -d db`, then `uv run alembic upgrade head && uv run python -m zaspro.seeding.run`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: zaspro
      POSTGRES_PASSWORD: zaspro
      POSTGRES_DB: zaspro
    ports:
      - "5432:5432"
    volumes:
      - zaspro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaspro -d zaspro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zaspro_pgdata:
