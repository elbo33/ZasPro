[project]
name = "zaspro"
version = "0.0.0"
description = "Polish Matura knowledge base — extraction pipeline foundations (M0)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pdfplumber>=0.11",
    "sympy>=1.14.0",
    "lark>=1.3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.2",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zaspro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # sympy's lark latex backend still probes for the antlr runtime on import
    "ignore:.*antlr4.*:UserWarning",
]

# M0 uses poppler (pdftotext / pdfinfo / pdffonts) and pandoc as external
# subprocesses, and LibreOffice headless for figure work (M0.4). Those are
# system tools, not Python deps; see docs/decisions/dependencies.md.
