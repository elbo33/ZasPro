section: funkcja-kwadratowa-wykres-postacie
name: 'Funkcja kwadratowa: wykres, postacie i wyznaczanie wzoru'
scope: Sketching y = ax^2 + bx + c; interpreting coefficients in general, vertex and factored form; finding
  the formula from given information or a graph.
requirements:
- V.7
- V.8
- V.9
spec:
  agent: claude
  model: claude-opus-5
  prompt_version: m4-sec-v1
  written_at: '2026-08-28T14:45:18.317400'
  approved_at: '2026-08-28T18:28:04.869921'
  approved_by: reviewer
concepts:
- name: Funkcja kwadratowa (trójmian kwadratowy)
  description: Funkcja określona dla każdej liczby rzeczywistej wzorem f(x) = ax² + bx + c, gdzie a, b,
    c są liczbami rzeczywistymi i a ≠ 0.
  explanation: 'Warunek a ≠ 0 jest kluczowy: gdy a = 0, zostaje funkcja liniowa. Dziedziną (o ile zadanie
    nie mówi inaczej) jest zawsze zbiór R, więc dziedzina nie jest tu tematem – całą informację niesie
    trójka współczynników a, b, c.'
  difficulty: 1
- name: Parabola i jej ramiona
  description: Wykresem funkcji kwadratowej jest parabola o osi symetrii równoległej do osi OY. Jeśli
    a > 0, ramiona paraboli są skierowane w górę, jeśli a < 0 – w dół.
  explanation: 'Znak a to pierwsza rzecz, którą odczytujesz z wzoru lub z rysunku. Decyduje o tym, czy
    funkcja ma wartość najmniejszą (a > 0), czy największą (a < 0). Wartość bezwzględna |a| decyduje o
    „rozwartości”: im większe |a|, tym parabola węższa (bardziej stroma), im mniejsze |a| – tym szersza.'
  difficulty: 1
- name: Postać ogólna
  description: f(x) = ax² + bx + c, a ≠ 0.
  explanation: 'Z niej najłatwiej odczytać punkt przecięcia z osią OY: f(0) = c, czyli punkt (0, c). Współczynnik
    b sam w sobie nie ma prostej interpretacji graficznej, ale razem z a wyznacza położenie osi symetrii:
    x = −b/(2a). Znak iloczynu a·b mówi, po której stronie osi OY leży wierzchołek (a·b > 0 → wierzchołek
    na lewo od OY).'
  difficulty: 1
- name: Wyróżnik (delta)
  description: Δ = b² − 4ac – liczba przypisana trójmianowi ax² + bx + c.
  explanation: 'Delta odpowiada na pytanie „ile razy parabola przecina oś OX”: Δ > 0 – dwa miejsca zerowe
    (dwa punkty przecięcia), Δ = 0 – jedno miejsce zerowe (wierzchołek leży na osi OX), Δ < 0 – brak miejsc
    zerowych (cała parabola nad lub pod osią OX). Delta wchodzi też do wzoru na drugą współrzędną wierzchołka.'
  difficulty: 2
- name: Miejsca zerowe funkcji kwadratowej
  description: Liczby x, dla których f(x) = 0, czyli rozwiązania równania ax² + bx + c = 0; graficznie
    – odcięte punktów przecięcia paraboli z osią OX.
  explanation: 'Znajdujesz je ze wzorów z deltą albo prościej: wyłączając x przed nawias (gdy c = 0) lub
    ze wzorów skróconego mnożenia (gdy b = 0). Miejsca zerowe leżą symetrycznie względem osi symetrii
    paraboli.'
  difficulty: 2
- name: Postać kanoniczna
  description: f(x) = a(x − p)² + q, gdzie W = (p, q) jest wierzchołkiem paraboli.
  explanation: 'To postać „gotowa do rysowania”: wykres powstaje z wykresu y = ax² przez przesunięcie
    o wektor [p, q]. Uwaga na znaki – w a(x + 3)² − 5 mamy p = −3, q = −5. Każda funkcja kwadratowa ma
    postać kanoniczną.'
  difficulty: 2
- name: Wierzchołek paraboli
  description: Punkt W = (p, q), w którym parabola „zawraca”; p = −b/(2a), q = −Δ/(4a) = f(p).
  explanation: Dla a > 0 wierzchołek to najniższy punkt wykresu (q – wartość najmniejsza funkcji), dla
    a < 0 – najwyższy (q – wartość największa). Zamiast liczyć q ze wzoru z deltą, można bezpiecznie policzyć
    f(p).
  difficulty: 2
- name: Oś symetrii paraboli
  description: Prosta o równaniu x = p, gdzie p = −b/(2a); wykres funkcji kwadratowej jest symetryczny
    względem tej prostej.
  explanation: 'Dzięki symetrii: f(p − t) = f(p + t) dla każdego t. Jeśli znasz dwa punkty wykresu o tej
    samej rzędnej, oś symetrii przechodzi w połowie odległości między nimi – to najszybszy sposób na znalezienie
    p, gdy dane są miejsca zerowe.'
  difficulty: 2
- name: Postać iloczynowa
  description: f(x) = a(x − x₁)(x − x₂), gdy Δ > 0 (x₁, x₂ – miejsca zerowe), lub f(x) = a(x − x₀)², gdy
    Δ = 0.
  explanation: 'Istnieje tylko wtedy, gdy Δ ≥ 0. Z tej postaci od razu widać miejsca zerowe – uwaga na
    znaki: z a(x + 2)(x − 5) czytamy zera −2 i 5. Gdy Δ < 0, postaci iloczynowej nie ma i tak trzeba to
    napisać w odpowiedzi.'
  difficulty: 2
- name: Zbiór wartości funkcji kwadratowej
  description: 'Dla a > 0: ZW = ⟨q, +∞); dla a < 0: ZW = (−∞, q⟩, gdzie q to druga współrzędna wierzchołka.'
  explanation: Zbiór wartości „startuje” od q i idzie w stronę, w którą skierowane są ramiona. Nawias
    przy q jest zawsze domknięty, bo wartość q jest osiągana (w wierzchołku).
  difficulty: 2
- name: Monotoniczność funkcji kwadratowej
  description: Dla a > 0 funkcja maleje w (−∞, p⟩ i rośnie w ⟨p, +∞); dla a < 0 – odwrotnie.
  explanation: Oś symetrii dzieli wykres na dwie „gałęzie”. Funkcja kwadratowa nigdy nie jest monotoniczna
    na całym R – to częsty punkt zadań o przedziałach monotoniczności.
  difficulty: 2
- name: Przesunięcie wykresu y = ax²
  description: Wykres funkcji y = a(x − p)² + q powstaje z wykresu y = ax² przez przesunięcie równoległe
    o wektor u = [p, q].
  explanation: 'Przesunięcie w poziomie „działa odwrotnie” niż podpowiada intuicja: (x − 3)² to przesunięcie
    w prawo o 3. Przesunięcia nie zmieniają a, więc kształt paraboli pozostaje ten sam.'
  difficulty: 2
- name: Znak funkcji kwadratowej
  description: Zbiory argumentów, dla których f(x) > 0 lub f(x) < 0, odczytane z położenia paraboli względem
    osi OX.
  explanation: 'Przy Δ > 0 i a > 0: f(x) > 0 poza przedziałem (x₁, x₂), f(x) < 0 wewnątrz. Przy Δ < 0
    funkcja ma stały znak – zgodny ze znakiem a. Szkic wykresu wystarcza, by to odczytać, nie trzeba pamiętać
    reguł na pamięć.'
  difficulty: 2
- name: Wyznaczanie wzoru funkcji z danych
  description: Odtworzenie liczb a, b, c (lub a, p, q, lub a, x₁, x₂) na podstawie informacji o funkcji
    lub jej wykresie.
  explanation: 'Reguła strategiczna: wybierz tę postać, do której dane pasują najlepiej. Wierzchołek →
    kanoniczna, miejsca zerowe → iloczynowa, trzy dowolne punkty → ogólna i układ równań. Zawsze potrzebujesz
    trzech niezależnych informacji (albo dwóch, jeśli jedna z nich to wierzchołek lub para miejsc zerowych).'
  difficulty: 3
formulas:
- name: Postać ogólna
  latex_raw: f(x)=ax^{2}+bx+c
  conditions: a \neq 0, x \in \mathbb{R}
  description: f(0)=c – punkt przecięcia wykresu z osią OY to (0, c).
- name: Wyróżnik trójmianu
  latex_raw: \Delta = b^{2}-4ac
  conditions: dla f(x)=ax^2+bx+c, a \neq 0
- name: Miejsca zerowe
  latex_raw: x_{1}=\frac{-b-\sqrt{\Delta}}{2a},\qquad x_{2}=\frac{-b+\sqrt{\Delta}}{2a}
  conditions: Δ > 0
  description: Dla Δ = 0 jedno miejsce zerowe x₀ = −b/(2a); dla Δ < 0 brak miejsc zerowych.
- name: Współrzędne wierzchołka
  latex_raw: p=\frac{-b}{2a},\qquad q=\frac{-\Delta}{4a}=f(p)
  conditions: a \neq 0
- name: Postać kanoniczna
  latex_raw: f(x)=a(x-p)^{2}+q
  conditions: zawsze istnieje (a ≠ 0); W = (p, q) jest wierzchołkiem
- name: Postać iloczynowa
  latex_raw: f(x)=a(x-x_{1})(x-x_{2})
  conditions: 'tylko gdy Δ > 0 (dla Δ = 0: f(x)=a(x-x_0)^2; dla Δ < 0 postać iloczynowa nie istnieje)'
- name: Oś symetrii z miejsc zerowych
  latex_raw: p=\frac{x_{1}+x_{2}}{2}
  conditions: gdy istnieją dwa miejsca zerowe x₁, x₂
- name: Równanie osi symetrii
  latex_raw: x=p=\frac{-b}{2a}
  conditions: a \neq 0
- name: Zbiór wartości
  latex_raw: ZW=\langle q,+\infty)\ \text{dla } a>0,\qquad ZW=(-\infty,q\rangle\ \text{dla } a<0
  conditions: q – druga współrzędna wierzchołka
- name: Rozwinięcie postaci kanonicznej do ogólnej
  latex_raw: a(x-p)^{2}+q = ax^{2}-2apx+(ap^{2}+q)
  conditions: zawsze
  description: Stąd b = −2ap oraz c = ap² + q.
- name: Rozwinięcie postaci iloczynowej do ogólnej
  latex_raw: a(x-x_{1})(x-x_{2}) = ax^{2}-a(x_{1}+x_{2})x+ax_{1}x_{2}
  conditions: gdy postać iloczynowa istnieje
methods:
- name: Szkicowanie wykresu funkcji danej w postaci ogólnej
  when_to_use: Gdy masz f(x) = ax² + bx + c i chcesz narysować parabolę oraz odczytać jej własności.
  steps:
  - Sprawdź znak a i ustal kierunek ramion (a > 0 – w górę, a < 0 – w dół).
  - 'Zaznacz punkt przecięcia z osią OY: (0, c).'
  - Oblicz Δ = b² − 4ac i na tej podstawie ustal liczbę miejsc zerowych.
  - Jeśli Δ ≥ 0, oblicz miejsca zerowe i zaznacz je na osi OX.
  - Oblicz p = −b/(2a) oraz q = f(p); zaznacz wierzchołek W(p, q) i narysuj przerywaną oś symetrii x =
    p.
  - W razie potrzeby dolicz jeszcze jeden punkt (np. punkt symetryczny do (0, c), czyli (2p, c)).
  - Połącz punkty gładką parabolą symetryczną względem prostej x = p; podpisz osie i zaznaczone punkty.
- name: Szkicowanie wykresu z postaci kanonicznej (przez przesunięcie)
  when_to_use: Gdy wzór jest podany jako a(x − p)² + q albo gdy masz opisać przekształcenie wykresu y
    = ax².
  steps:
  - Odczytaj a, p, q, pilnując znaków (np. w −2(x + 1)² + 3 jest a = −2, p = −1, q = 3).
  - Narysuj pomocniczo (lub wyobraź sobie) wykres y = ax².
  - 'Przesuń go o wektor [p, q]: o |p| w prawo (p > 0) lub w lewo (p < 0) i o |q| w górę (q > 0) lub w
    dół (q < 0).'
  - Zaznacz wierzchołek (p, q) i punkt (0, f(0)).
  - 'Odczytaj żądane własności: zbiór wartości, przedziały monotoniczności, wartość najmniejsza/największa.'
- name: Zamiana postaci ogólnej na kanoniczną i iloczynową
  when_to_use: Gdy zadanie żąda podania innej postaci wzoru albo gdy potrzebujesz wierzchołka lub miejsc
    zerowych.
  steps:
  - Oblicz Δ = b² − 4ac.
  - Oblicz p = −b/(2a) i q = −Δ/(4a) (lub q = f(p)) i zapisz postać kanoniczną f(x) = a(x − p)² + q.
  - Jeśli Δ < 0 – napisz, że postać iloczynowa nie istnieje, i zakończ.
  - Jeśli Δ ≥ 0 – oblicz miejsca zerowe ze wzorów z √Δ.
  - Zapisz postać iloczynową f(x) = a(x − x₁)(x − x₂) (lub a(x − x₀)² przy Δ = 0), pamiętając o współczynniku
    a przed nawiasami.
  - 'Kontrola: wymnóż postać iloczynową lub kanoniczną i porównaj z wyjściową postacią ogólną.'
- name: Zamiana postaci kanonicznej lub iloczynowej na ogólną
  when_to_use: Gdy w odpowiedzi wymagana jest postać ax² + bx + c (np. po wyznaczeniu wzoru z danych).
  steps:
  - 'Dla postaci kanonicznej: rozwiń kwadrat (x − p)² = x² − 2px + p² ze wzoru skróconego mnożenia.'
  - 'Dla postaci iloczynowej: wymnóż nawiasy (x − x₁)(x − x₂) = x² − (x₁ + x₂)x + x₁x₂.'
  - Pomnóż wynik przez a.
  - Dodaj q (w przypadku kanonicznej) i zredukuj wyrazy podobne.
  - Sprawdź wynik, podstawiając jedną wygodną wartość x (np. x = 0 lub x = 1) do obu postaci.
- name: Wyznaczanie wzoru, gdy dany jest wierzchołek i jeden punkt
  when_to_use: 'Gdy informacja to: wierzchołek W(p, q), albo oś symetrii + wartość najmniejsza/największa,
    albo najniższy/najwyższy punkt wykresu – plus jeden dodatkowy punkt.'
  steps:
  - 'Zapisz postać kanoniczną z wpisanymi p i q: f(x) = a(x − p)² + q.'
  - 'Podstaw współrzędne znanego punktu (x₀, y₀): y₀ = a(x₀ − p)² + q.'
  - Rozwiąż równanie liniowe względem a.
  - Wpisz a do wzoru i – jeśli trzeba – przekształć do postaci ogólnej lub iloczynowej.
  - 'Sprawdź: czy znak a zgadza się z kierunkiem ramion i czy punkt rzeczywiście spełnia wzór.'
- name: Wyznaczanie wzoru, gdy dane są miejsca zerowe i jeden punkt
  when_to_use: Gdy z treści lub z rysunku odczytujesz punkty przecięcia z osią OX oraz jeszcze jeden punkt
    wykresu (często (0, c) lub wierzchołek).
  steps:
  - Zapisz postać iloczynową f(x) = a(x − x₁)(x − x₂) z wpisanymi miejscami zerowymi.
  - Podstaw współrzędne dodatkowego punktu i rozwiąż równanie względem a.
  - Jeśli zamiast punktu dana jest wartość największa/najmniejsza q, najpierw oblicz p = (x₁ + x₂)/2,
    a potem podstaw punkt (p, q).
  - Zapisz gotowy wzór w żądanej postaci.
  - Sprawdź, czy dla obu miejsc zerowych wzór daje 0.
- name: Wyznaczanie wzoru z trzech punktów (układ równań)
  when_to_use: Gdy dane są trzy dowolne punkty wykresu i żaden z nich nie jest wierzchołkiem ani nie ma
    pary miejsc zerowych.
  steps:
  - Zapisz f(x) = ax² + bx + c.
  - Podstaw kolejno współrzędne trzech punktów, otrzymując trzy równania z niewiadomymi a, b, c.
  - Jeśli wśród punktów jest (0, y₀), od razu c = y₀ – to znacznie upraszcza układ.
  - Rozwiąż układ metodą podstawiania lub przeciwnych współczynników.
  - Zapisz wzór i sprawdź go, podstawiając wszystkie trzy punkty.
- name: Odczytywanie wzoru z narysowanego wykresu
  when_to_use: Gdy w zadaniu jest rysunek paraboli i trzeba podać jej wzór lub własności.
  steps:
  - Odczytaj kierunek ramion – ustal znak a.
  - 'Poszukaj na rysunku punktów o „ładnych”, całkowitych współrzędnych: wierzchołek, punkty przecięcia
    z osiami, punkty kratowe.'
  - Wybierz postać dopasowaną do odczytanych danych (kanoniczna – gdy widać wierzchołek, iloczynowa –
    gdy widać dwa miejsca zerowe).
  - Wyznacz a przez podstawienie jeszcze jednego odczytanego punktu.
  - Zweryfikuj wzór na innym punkcie wykresu, którego nie użyłeś przy liczeniu.
examples:
- statement: Naszkicuj wykres funkcji f(x) = x² − 4x + 3. Podaj miejsca zerowe, współrzędne wierzchołka,
    zbiór wartości i przedziały monotoniczności.
  worked_solution: |-
    a = 1 > 0, więc ramiona skierowane w górę. Przecięcie z OY: f(0) = 3, punkt (0, 3).
    Δ = (−4)² − 4·1·3 = 16 − 12 = 4, √Δ = 2.
    x₁ = (4 − 2)/2 = 1, x₂ = (4 + 2)/2 = 3 – parabola przecina oś OX w punktach (1, 0) i (3, 0).
    Wierzchołek: p = −(−4)/(2·1) = 2, q = f(2) = 4 − 8 + 3 = −1, więc W = (2, −1). (Kontrola: q = −Δ/(4a) = −4/4 = −1.)
    Oś symetrii: x = 2. Punkt symetryczny do (0, 3) to (4, 3).
    Szkic: parabola „uśmiechnięta”, przechodząca przez (0,3), (1,0), (2,−1), (3,0), (4,3).
    Zbiór wartości: ZW = ⟨−1, +∞).
    Funkcja maleje w (−∞, 2⟩ i rośnie w ⟨2, +∞).
  difficulty: 2
- statement: Dana jest funkcja f(x) = −2(x + 1)² + 8. Podaj współrzędne wierzchołka, zapisz wzór w postaci
    ogólnej i iloczynowej oraz opisz, jak powstaje wykres f z wykresu y = −2x².
  worked_solution: |-
    Postać kanoniczna: a = −2, p = −1, q = 8, więc W = (−1, 8). Ramiona w dół, wartość największa funkcji wynosi 8.
    Postać ogólna: f(x) = −2(x² + 2x + 1) + 8 = −2x² − 4x − 2 + 8 = −2x² − 4x + 6.
    Miejsca zerowe: −2(x + 1)² + 8 = 0 ⟺ (x + 1)² = 4 ⟺ x + 1 = 2 lub x + 1 = −2, czyli x = 1 lub x = −3.
    Postać iloczynowa: f(x) = −2(x − 1)(x + 3). (Sprawdzenie: −2(x² + 2x − 3) = −2x² − 4x + 6 ✔)
    Wykres: wykres y = −2x² przesunięty o wektor [−1, 8], czyli o 1 jednostkę w lewo i 8 jednostek w górę.
  difficulty: 2
- statement: Wykres funkcji kwadratowej f ma wierzchołek w punkcie W = (2, −3) i przechodzi przez punkt
    A = (0, 5). Wyznacz wzór funkcji f w postaci ogólnej.
  worked_solution: |-
    Skoro znamy wierzchołek, zaczynamy od postaci kanonicznej: f(x) = a(x − 2)² − 3.
    Podstawiamy A(0, 5): 5 = a(0 − 2)² − 3, czyli 5 = 4a − 3, stąd 4a = 8, a = 2.
    Zatem f(x) = 2(x − 2)² − 3 = 2(x² − 4x + 4) − 3 = 2x² − 8x + 8 − 3 = 2x² − 8x + 5.
    Sprawdzenie: f(0) = 5 ✔, p = 8/(2·2) = 2 ✔, f(2) = 8 − 16 + 5 = −3 ✔.
    Odpowiedź: f(x) = 2x² − 8x + 5.
  difficulty: 3
- statement: Funkcja kwadratowa f przyjmuje wartość największą równą 9, a jej miejsca zerowe to −2 i 4.
    Wyznacz wzór funkcji f w postaci kanonicznej i ogólnej oraz podaj jej zbiór wartości.
  worked_solution: |-
    Skoro funkcja ma wartość największą, to a < 0. Znamy miejsca zerowe, więc: f(x) = a(x + 2)(x − 4).
    Oś symetrii przechodzi w połowie między zerami: p = (−2 + 4)/2 = 1, a wartość największa to q = 9, więc wierzchołek to W = (1, 9).
    Podstawiamy punkt (1, 9) do postaci iloczynowej: 9 = a(1 + 2)(1 − 4) = a·3·(−3) = −9a, stąd a = −1 (istotnie a < 0 ✔).
    Postać kanoniczna: f(x) = −(x − 1)² + 9.
    Postać ogólna: f(x) = −(x² − 2x + 1) + 9 = −x² + 2x + 8.
    Sprawdzenie zer: −x² + 2x + 8 = 0 ⟺ x² − 2x − 8 = 0, Δ = 4 + 32 = 36, x = (2 ± 6)/2, czyli x = 4 lub x = −2 ✔.
    Zbiór wartości: ZW = (−∞, 9⟩.
  difficulty: 4
- statement: Wykres funkcji kwadratowej przechodzi przez punkty A = (0, −6), B = (1, −8) i C = (−2, 4).
    Wyznacz wzór tej funkcji i sprawdź, czy ma ona postać iloczynową; jeśli tak – zapisz ją.
  worked_solution: |-
    Przyjmujemy f(x) = ax² + bx + c.
    Z punktu A: f(0) = c = −6.
    Z punktu B: a + b + c = −8, czyli a + b = −2.
    Z punktu C: 4a − 2b + c = 4, czyli 4a − 2b = 10, po podzieleniu przez 2: 2a − b = 5.
    Dodajemy stronami a + b = −2 i 2a − b = 5: 3a = 3, więc a = 1, a stąd b = −3.
    Wzór: f(x) = x² − 3x − 6.
    Δ = 9 + 24 = 33 > 0, więc postać iloczynowa istnieje. √33 nie jest liczbą wymierną, ale to nie przeszkadza: x₁ = (3 − √33)/2, x₂ = (3 + √33)/2, zatem
    f(x) = (x − (3 − √33)/2)(x − (3 + √33)/2).
    Sprawdzenie danych: f(1) = 1 − 3 − 6 = −8 ✔, f(−2) = 4 + 6 − 6 = 4 ✔.
  difficulty: 4
objectives:
- statement: Rozpoznać funkcję kwadratową i wskazać współczynniki a, b, c w postaci ogólnej oraz a, p,
    q w postaci kanonicznej.
  bloom_level: zapamiętywanie
- statement: Wyjaśnić znaczenie znaku i wartości bezwzględnej współczynnika a, znaczenie c oraz znaczenie
    p i q dla położenia i kształtu paraboli.
  bloom_level: rozumienie
- statement: Obliczyć wyróżnik, miejsca zerowe i współrzędne wierzchołka funkcji kwadratowej danej w postaci
    ogólnej.
  bloom_level: stosowanie
- statement: Naszkicować wykres funkcji kwadratowej danej w postaci ogólnej, kanonicznej lub iloczynowej,
    zaznaczając wierzchołek, oś symetrii i punkty przecięcia z osiami.
  bloom_level: stosowanie
- statement: Przekształcić wzór funkcji kwadratowej między postacią ogólną, kanoniczną i iloczynową oraz
    uzasadnić, kiedy postać iloczynowa nie istnieje.
  bloom_level: stosowanie
- statement: Odczytać z wykresu lub ze wzoru zbiór wartości, wartość najmniejszą/największą, przedziały
    monotoniczności oraz zbiory argumentów, dla których funkcja przyjmuje wartości dodatnie i ujemne.
  bloom_level: analiza
- statement: Wyznaczyć wzór funkcji kwadratowej na podstawie wierzchołka i punktu, miejsc zerowych i punktu
    lub trzech punktów wykresu, dobierając najwygodniejszą postać wzoru.
  bloom_level: analiza
- statement: Zweryfikować poprawność wyznaczonego wzoru przez podstawienie danych punktów oraz porównanie
    z własnościami odczytanymi z rysunku (kierunek ramion, położenie wierzchołka).
  bloom_level: ocenianie
misconceptions:
- name: Mylenie znaków p i q w postaci kanonicznej
  incorrect_reasoning: Z wzoru f(x) = 2(x + 3)² − 5 uczeń odczytuje wierzchołek (3, −5) albo (3, 5).
  correct_reasoning: 'Wzorzec to a(x − p)² + q, więc x + 3 = x − (−3) daje p = −3, a q = −5; wierzchołek
    to (−3, −5). Można to sprawdzić: f(−3) = −5 – to najniższy punkt wykresu.'
  severity: 4
- name: Pominięcie minusa we wzorach na wierzchołek
  incorrect_reasoning: Uczeń liczy p = b/(2a) lub q = Δ/(4a), np. dla f(x) = x² − 4x + 3 podaje p = −4/2
    = −2.
  correct_reasoning: 'Poprawne wzory to p = −b/(2a) oraz q = −Δ/(4a). Dla f(x) = x² − 4x + 3: p = 4/2
    = 2. Bezpieczna kontrola: policz q jako f(p) i sprawdź, czy wierzchołek leży „między” miejscami zerowymi.'
  severity: 4
- name: Zapominanie o współczynniku a w postaci iloczynowej
  incorrect_reasoning: Dla f(x) = 2x² − 8x + 6 uczeń znajduje zera 1 i 3 i pisze f(x) = (x − 1)(x − 3).
  correct_reasoning: 'Postać iloczynowa to a(x − x₁)(x − x₂), więc f(x) = 2(x − 1)(x − 3). Kontrola przez
    wymnożenie: 2(x² − 4x + 3) = 2x² − 8x + 6 ✔, natomiast (x − 1)(x − 3) = x² − 4x + 3 to inna funkcja.'
  severity: 4
- name: Przekonanie, że każda funkcja kwadratowa ma postać iloczynową
  incorrect_reasoning: Uczeń „na siłę” zapisuje postać iloczynową także wtedy, gdy Δ < 0, albo twierdzi,
    że skoro nie ma miejsc zerowych, to nie ma też wykresu.
  correct_reasoning: 'Postać kanoniczna istnieje zawsze, iloczynowa – tylko dla Δ ≥ 0. Gdy Δ < 0, parabola
    istnieje, lecz w całości leży nad osią OX (a > 0) albo pod nią (a < 0), a w odpowiedzi należy napisać:
    postać iloczynowa nie istnieje.'
  severity: 3
- name: Mylenie miejsc zerowych ze znakami w nawiasach
  incorrect_reasoning: Z wzoru f(x) = 3(x + 2)(x − 5) uczeń odczytuje miejsca zerowe 2 i −5.
  correct_reasoning: 'Miejsce zerowe to liczba, która zeruje nawias: x + 2 = 0 → x = −2, x − 5 = 0 → x
    = 5. Zawsze można podstawić i sprawdzić: f(−2) = 0 ✔.'
  severity: 3
- name: Traktowanie punktu (0, c) jako wierzchołka
  incorrect_reasoning: Uczeń uznaje, że c z postaci ogólnej to wartość najmniejsza/największa funkcji,
    bo „tam wykres się zaczyna”.
  correct_reasoning: c to tylko rzędna punktu przecięcia z osią OY. Wartość ekstremalna to q = f(p), gdzie
    p = −b/(2a). Punkt (0, c) jest wierzchołkiem tylko wtedy, gdy b = 0.
  severity: 3
- name: Błędny nawias w zbiorze wartości i zły kierunek
  incorrect_reasoning: Dla funkcji o wierzchołku (2, −1) i a > 0 uczeń pisze ZW = (−1, +∞) albo ZW = (−∞,
    −1⟩.
  correct_reasoning: Wartość q jest osiągana w wierzchołku, więc nawias przy q jest domknięty; przy a
    > 0 wykres idzie w górę, zatem ZW = ⟨−1, +∞).
  severity: 3
- name: Nieuzasadnione zakładanie a = 1
  incorrect_reasoning: Mając miejsca zerowe −1 i 3, uczeń od razu pisze f(x) = (x + 1)(x − 3), nie korzystając
    z trzeciego warunku (dodatkowego punktu lub wartości ekstremalnej).
  correct_reasoning: Miejsca zerowe wyznaczają całą rodzinę funkcji a(x + 1)(x − 3) dla a ≠ 0. Trzeba
    wykorzystać dodatkową informację (punkt wykresu, wartość największa/najmniejsza, kierunek ramion),
    aby obliczyć a.
  severity: 4
- name: Odwrotny kierunek przesunięcia poziomego
  incorrect_reasoning: Uczeń twierdzi, że wykres y = (x − 4)² powstaje z y = x² przez przesunięcie o 4
    jednostki w lewo.
  correct_reasoning: Wierzchołek y = (x − 4)² to (4, 0), więc przesunięcie jest o 4 w prawo, czyli o wektor
    [4, 0]. Sprawdzenie na wierzchołku zawsze rozstrzyga wątpliwość.
  severity: 3
- name: Mylenie wpływu a na kształt
  incorrect_reasoning: „Im większe a, tym parabola szersza” albo „a zmienia położenie wykresu”.
  correct_reasoning: 'O szerokości decyduje |a|: im większe |a|, tym parabola węższa (bardziej stroma).
    Znak a decyduje o kierunku ramion, a nie o przesunięciu – za położenie odpowiadają p i q.'
  severity: 2
