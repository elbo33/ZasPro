section: funkcja-kwadratowa-wartosci-w-przedziale
name: Największa i najmniejsza wartość funkcji kwadratowej w przedziale
scope: Locating the extremum relative to a closed interval and reading off the greatest and least value
  on it.
requirements:
- V.10
spec:
  agent: claude
  model: claude-opus-5
  prompt_version: m4-sec-v1
  written_at: '2026-08-28T14:47:32.166903'
  approved_at: '2026-08-28T18:28:05.011720'
  approved_by: reviewer
concepts:
- name: Funkcja kwadratowa i jej postacie
  description: Funkcja postaci f(x)=ax^2+bx+c, gdzie a≠0 (postać ogólna); równoważnie f(x)=a(x-p)^2+q
    (postać kanoniczna), a gdy Δ≥0 także f(x)=a(x-x_1)(x-x_2) (postać iloczynowa).
  explanation: Do zadań o wartości największej i najmniejszej najwygodniejsza jest postać kanoniczna –
    od razu widać w niej wierzchołek (p,q). Z postaci ogólnej wierzchołek liczymy ze wzorów, z postaci
    iloczynowej p to średnia arytmetyczna miejsc zerowych.
  difficulty: 1
- name: Wierzchołek paraboli W=(p,q)
  description: Punkt wykresu funkcji kwadratowej o współrzędnych p=-b/(2a), q=f(p)=-Δ/(4a); jest to punkt,
    w którym funkcja przyjmuje wartość ekstremalną na całej dziedzinie.
  explanation: p to ARGUMENT (miejsce na osi x), q to WARTOŚĆ funkcji. W odpowiedzi do zadania o największą/najmniejszą
    wartość podajemy q (albo inną wartość funkcji), a p służy tylko do zlokalizowania miejsca.
  difficulty: 1
- name: Kierunek ramion paraboli
  description: Gdy a>0 ramiona skierowane są w górę i funkcja ma wartość najmniejszą q (nie ma największej
    na R); gdy a<0 ramiona skierowane są w dół i funkcja ma wartość największą q (nie ma najmniejszej
    na R).
  explanation: Znak a decyduje o tym, czy wierzchołek jest 'dołkiem', czy 'górką'. To pierwsza rzecz,
    którą sprawdzamy w każdym takim zadaniu.
  difficulty: 1
- name: Monotoniczność funkcji kwadratowej
  description: Dla a>0 funkcja maleje w (-∞,p⟩ i rośnie w ⟨p,+∞); dla a<0 rośnie w (-∞,p⟩ i maleje w ⟨p,+∞).
  explanation: 'To klucz do przypadku, gdy wierzchołek leży poza przedziałem: wtedy na całym przedziale
    funkcja jest monotoniczna, więc wartości skrajne przyjmuje na końcach przedziału.'
  difficulty: 2
- name: Przedział domknięty ⟨m,n⟩
  description: Zbiór wszystkich x spełniających m≤x≤n; oba końce należą do przedziału.
  explanation: 'Domkniętość jest istotna: skoro końce należą do przedziału, wartości f(m) i f(n) są rzeczywiście
    przyjmowane i mogą być wartością największą lub najmniejszą. W przedziale otwartym takich wartości
    może nie być.'
  difficulty: 1
- name: Wartość największa i najmniejsza funkcji w przedziale
  description: Wartością największą funkcji f w przedziale ⟨m,n⟩ nazywamy taką liczbę M, że M=f(x_0) dla
    pewnego x_0∈⟨m,n⟩ oraz f(x)≤M dla każdego x∈⟨m,n⟩; analogicznie definiujemy wartość najmniejszą (z
    nierównością ≥).
  explanation: Wartość musi być PRZYJMOWANA przez funkcję – nie wystarczy, że ogranicza od góry. Funkcja
    kwadratowa jest ciągła, więc w przedziale domkniętym zawsze obie te wartości istnieją.
  difficulty: 2
- name: Kandydaci na ekstrema w przedziale
  description: 'Dla funkcji kwadratowej na ⟨m,n⟩ wartość największa i najmniejsza są przyjmowane wyłącznie
    w punktach: m, n oraz p (ten ostatni tylko wtedy, gdy p∈⟨m,n⟩).'
  explanation: Cała metoda sprowadza się do policzenia co najwyżej trzech liczb f(m), f(n), f(p) i wybrania
    spośród nich największej i najmniejszej.
  difficulty: 2
- name: Oś symetrii paraboli x=p i porównywanie końców
  description: Prosta x=p jest osią symetrii wykresu; punkty równo oddalone od p mają równe wartości funkcji,
    a im dalej argument leży od p, tym wartość jest większa (gdy a>0) lub mniejsza (gdy a<0).
  explanation: Zamiast liczyć f(m) i f(n), można porównać odległości |m-p| i |n-p|. Dla a>0 dalszy koniec
    daje wartość większą; dla a<0 – mniejszą. Przydatne, gdy liczby są brzydkie.
  difficulty: 3
- name: Zbiór wartości funkcji kwadratowej w przedziale domkniętym
  description: Jeśli w ⟨m,n⟩ wartość najmniejsza wynosi m_0, a największa M_0, to zbiorem wartości funkcji
    zawężonej do tego przedziału jest cały przedział ⟨m_0,M_0⟩.
  explanation: 'Wynika to z ciągłości: funkcja kwadratowa nie ''przeskakuje'' żadnej wartości pomiędzy
    swoim minimum a maksimum na przedziale.'
  difficulty: 3
- name: Optymalizacja kwadratowa z ograniczeniem
  description: Zadanie praktyczne, w którym wielkość opisana funkcją kwadratową ma być największa lub
    najmniejsza, przy czym zmienna niezależna zmienia się w wyznaczonym z treści przedziale domkniętym.
  explanation: Najpierw ustalamy wzór funkcji i sensowny przedział zmiennej, dopiero potem stosujemy standardowy
    algorytm; wierzchołek może wypaść poza dopuszczalnym przedziałem i wtedy optimum jest na jego końcu.
  difficulty: 4
formulas:
- name: Pierwsza współrzędna wierzchołka
  latex_raw: p=-\frac{b}{2a}
  conditions: f(x)=ax^2+bx+c, a\neq 0
  description: Jeśli funkcja ma miejsca zerowe x_1, x_2, to również p=\frac{x_1+x_2}{2}.
- name: Druga współrzędna wierzchołka
  latex_raw: q=f(p)=-\frac{\Delta}{4a},\qquad \Delta=b^2-4ac
  conditions: f(x)=ax^2+bx+c, a\neq 0
  description: Bezpieczniej (i bez błędów znaku) policzyć po prostu q=f(p), podstawiając p do wzoru funkcji.
- name: Postać kanoniczna
  latex_raw: f(x)=a(x-p)^2+q
  conditions: a\neq 0, p i q to współrzędne wierzchołka
  description: Z niej odczytujemy wierzchołek natychmiast.
- name: Wartości ekstremalne na przedziale, gdy p∈⟨m,n⟩ i a>0
  latex_raw: f_{\min}=f(p)=q,\qquad f_{\max}=\max\{f(m),f(n)\}
  conditions: a>0 oraz m\le p\le n
- name: Wartości ekstremalne na przedziale, gdy p∈⟨m,n⟩ i a<0
  latex_raw: f_{\max}=f(p)=q,\qquad f_{\min}=\min\{f(m),f(n)\}
  conditions: a<0 oraz m\le p\le n
- name: Wartości ekstremalne, gdy wierzchołek leży poza przedziałem
  latex_raw: f_{\min}=\min\{f(m),f(n)\},\qquad f_{\max}=\max\{f(m),f(n)\}
  conditions: p<m lub p>n (funkcja jest wtedy monotoniczna na ⟨m,n⟩)
- name: Reguła odległości od osi symetrii
  latex_raw: '|x_1-p|<|x_2-p| \Rightarrow \big(a>0 \Rightarrow f(x_1)<f(x_2)\big),\ \big(a<0 \Rightarrow
    f(x_1)>f(x_2)\big)'
  conditions: x_1, x_2 dowolne argumenty, a\neq 0
- name: Zbiór wartości w przedziale domkniętym
  latex_raw: f(\langle m,n\rangle)=\langle f_{\min}, f_{\max}\rangle
  conditions: f kwadratowa (ciągła), ⟨m,n⟩ przedział domknięty
methods:
- name: Algorytm wyznaczania wartości największej i najmniejszej funkcji kwadratowej w ⟨m,n⟩
  when_to_use: Zawsze, gdy mamy wzór funkcji kwadratowej i przedział domknięty i pytamy o wartość największą
    i/lub najmniejszą.
  steps:
  - Odczytaj współczynnik a i ustal kierunek ramion (a>0 – w górę, a<0 – w dół).
  - Wyznacz p=-b/(2a) (albo odczytaj p z postaci kanonicznej lub ze średniej miejsc zerowych).
  - Sprawdź, czy p należy do ⟨m,n⟩, tzn. czy m≤p≤n.
  - 'Jeśli p∈⟨m,n⟩: policz f(p), f(m), f(n). Jeśli p∉⟨m,n⟩: policz tylko f(m) i f(n).'
  - Wybierz spośród policzonych liczb największą i najmniejszą; przy a>0 i p w przedziale minimum to na
    pewno f(p), przy a<0 maksimum to na pewno f(p).
  - 'Zapisz odpowiedź w postaci: wartość największa wynosi ... i jest przyjmowana dla x=..., wartość najmniejsza
    wynosi ... dla x=... .'
- name: Metoda monotoniczności (wierzchołek poza przedziałem)
  when_to_use: Gdy stwierdzisz, że p<m lub p>n i chcesz uzasadnić, na którym końcu jest maksimum, a na
    którym minimum, bez zgadywania.
  steps:
  - 'Ustal znak a i wypisz przedziały monotoniczności: a>0 → maleje w (-∞,p⟩, rośnie w ⟨p,+∞); a<0 → odwrotnie.'
  - Stwierdź, po której stronie p leży cały przedział ⟨m,n⟩.
  - Wywnioskuj, czy f jest na ⟨m,n⟩ rosnąca, czy malejąca.
  - 'Jeśli rosnąca: f_min=f(m), f_max=f(n). Jeśli malejąca: f_min=f(n), f_max=f(m).'
  - Policz obie wartości i zapisz odpowiedź.
- name: Porównywanie wartości na końcach przez odległość od osi symetrii
  when_to_use: Gdy p leży wewnątrz przedziału i trzeba szybko rozstrzygnąć, który koniec daje wartość
    skrajną (szczególnie przy niewygodnych liczbach).
  steps:
  - Wyznacz p.
  - Policz odległości |m-p| i |n-p|.
  - Dla a>0 większą wartość daje koniec dalszy od p; dla a<0 – koniec bliższy p daje wartość większą.
  - W razie równości odległości wartości na końcach są równe (końce są symetryczne względem osi x=p).
  - Policz wartość funkcji tylko w wybranym punkcie.
- name: Wyznaczanie zbioru wartości funkcji kwadratowej w przedziale domkniętym
  when_to_use: Gdy pytanie brzmi 'jaki jest zbiór wartości' lub 'dla jakich y równanie f(x)=y ma rozwiązanie
    w ⟨m,n⟩'.
  steps:
  - Wyznacz f_min i f_max standardowym algorytmem.
  - 'Powołaj się na ciągłość funkcji kwadratowej: przyjmuje ona wszystkie wartości pomiędzy f_min i f_max.'
  - Zapisz zbiór wartości jako przedział domknięty ⟨f_min, f_max⟩.
- name: Rozwiązywanie zadań optymalizacyjnych z ograniczeniem przedziałowym
  when_to_use: W zadaniach z treścią (pole, koszt, zysk, wysokość rzutu), gdzie wielkość jest funkcją
    kwadratową zmiennej o ograniczonym zakresie.
  steps:
  - Wprowadź zmienną x i zapisz badaną wielkość jako funkcję kwadratową f(x).
  - Z treści zadania wyznacz przedział dopuszczalnych wartości x (warunki geometryczne, fizyczne, dodatkowe
    ograniczenia) – upewnij się, że jest domknięty.
  - Wyznacz p i sprawdź, czy p należy do tego przedziału.
  - 'Zastosuj algorytm: policz f w wierzchołku (jeśli należy) i na końcach przedziału.'
  - Wybierz wartość odpowiadającą pytaniu i zinterpretuj wynik w języku zadania (z jednostkami).
examples:
- statement: Wyznacz wartość największą i najmniejszą funkcji f(x)=x^2-4x+1 w przedziale ⟨0,3⟩.
  worked_solution: |-
    Krok 1: a=1>0, ramiona w górę.
    Krok 2: p=-b/(2a)=-(-4)/(2·1)=2.
    Krok 3: 0≤2≤3, więc wierzchołek należy do przedziału.
    Krok 4: f(2)=4-8+1=-3, f(0)=0-0+1=1, f(3)=9-12+1=-2.
    Krok 5: Ponieważ a>0 i p∈⟨0,3⟩, wartość najmniejsza to f(2)=-3. Wartość największa to większa z liczb f(0)=1 i f(3)=-2, czyli 1.
    Odpowiedź: wartość najmniejsza wynosi -3 (dla x=2), wartość największa wynosi 1 (dla x=0).
  difficulty: 2
- statement: Wyznacz wartość największą i najmniejszą funkcji f(x)=-2x^2+4x+5 w przedziale ⟨2,4⟩.
  worked_solution: |-
    Krok 1: a=-2<0, ramiona w dół.
    Krok 2: p=-4/(2·(-2))=1.
    Krok 3: 1∉⟨2,4⟩ – wierzchołek leży NA LEWO od przedziału.
    Krok 4: Dla a<0 funkcja maleje w ⟨p,+∞)=⟨1,+∞), a cały przedział ⟨2,4⟩ zawiera się w ⟨1,+∞), więc f jest tam malejąca.
    Krok 5: f(2)=-8+8+5=5, f(4)=-32+16+5=-11.
    Odpowiedź: wartość największa wynosi 5 (dla x=2), wartość najmniejsza wynosi -11 (dla x=4). Zauważ, że wartość q=f(1)=7 NIE jest tu przyjmowana, bo x=1 nie należy do przedziału.
  difficulty: 2
- statement: Funkcja dana jest wzorem f(x)=-(x+1)^2+4. Wyznacz jej wartość największą i najmniejszą w
    przedziale ⟨-4,0⟩ oraz zbiór wartości w tym przedziale.
  worked_solution: |-
    Postać kanoniczna: a=-1<0, wierzchołek W=(-1,4), czyli p=-1, q=4.
    p=-1∈⟨-4,0⟩, a<0, więc wartość największa to q=4 (dla x=-1).
    Końce: f(-4)=-(-4+1)^2+4=-9+4=-5, f(0)=-(0+1)^2+4=-1+4=3.
    Wartość najmniejsza to mniejsza z nich: -5 (dla x=-4).
    Sprawdzenie regułą odległości: |-4-(-1)|=3, |0-(-1)|=1; dla a<0 dalszy koniec daje mniejszą wartość – zgadza się, minimum w x=-4.
    Zbiór wartości: funkcja kwadratowa jest ciągła, więc przyjmuje wszystkie wartości między -5 a 4, czyli ZW=⟨-5,4⟩.
  difficulty: 3
- statement: Obwód prostokąta wynosi 24 cm, a jeden z jego boków ma długość x cm, przy czym 2≤x≤5. Wyznacz
    największe i najmniejsze możliwe pole tego prostokąta.
  worked_solution: |-
    Jeżeli jeden bok ma długość x, to drugi ma 12-x (bo 2x+2y=24 ⇒ y=12-x).
    Pole: P(x)=x(12-x)=-x^2+12x, dla x∈⟨2,5⟩.
    a=-1<0, p=-12/(2·(-1))=6.
    6∉⟨2,5⟩ – wierzchołek leży na prawo od przedziału. Dla a<0 funkcja rośnie w (-∞,6⟩, a cały przedział ⟨2,5⟩ leży w (-∞,6⟩, więc P jest rosnąca.
    P(2)=2·10=20, P(5)=5·7=35.
    Odpowiedź: największe pole to 35 cm² (dla x=5 cm), najmniejsze to 20 cm² (dla x=2 cm). Uwaga: 'teoretyczne' maksimum P(6)=36 cm² jest nieosiągalne, bo x=6 nie spełnia warunku zadania.
  difficulty: 3
- statement: Dla funkcji f(x)=2x^2-6x+1 wyznacz wartość największą i najmniejszą w przedziale ⟨0,4⟩, a
    następnie podaj wszystkie x z tego przedziału, dla których f(x)=1.
  worked_solution: |-
    a=2>0, p=6/4=1,5 ∈⟨0,4⟩.
    f(1,5)=2·2,25-9+1=4,5-9+1=-3,5. (Kontrola wzorem: Δ=36-8=28, q=-28/8=-3,5.)
    f(0)=1, f(4)=32-24+1=9.
    Ponieważ a>0 i p w przedziale: f_min=-3,5 (dla x=1,5). Maksimum: max{1,9}=9 (dla x=4). Zgodne z regułą odległości: |4-1,5|=2,5 > |0-1,5|=1,5, a przy a>0 dalszy koniec daje wartość większą.
    Zbiór wartości na ⟨0,4⟩ to ⟨-3,5;9⟩, a 1 do niego należy, więc rozwiązania istnieją.
    Równanie: 2x^2-6x+1=1 ⇔ 2x^2-6x=0 ⇔ 2x(x-3)=0 ⇔ x=0 lub x=3. Oba należą do ⟨0,4⟩.
    Odpowiedź: f_max=9, f_min=-3,5; f(x)=1 dla x=0 i x=3.
  difficulty: 4
objectives:
- statement: Wyznaczyć współrzędne wierzchołka paraboli z postaci ogólnej, kanonicznej i iloczynowej.
  bloom_level: zastosowanie
- statement: Rozstrzygnąć, czy pierwsza współrzędna wierzchołka należy do danego przedziału domkniętego,
    i wskazać wynikające stąd konsekwencje.
  bloom_level: analiza
- statement: Wyznaczyć wartość największą i najmniejszą funkcji kwadratowej w przedziale domkniętym, podając
    także argumenty, dla których są one przyjmowane.
  bloom_level: zastosowanie
- statement: Uzasadnić położenie ekstremów, powołując się na kierunek ramion paraboli i przedziały monotoniczności
    funkcji kwadratowej.
  bloom_level: analiza
- statement: Porównać wartości funkcji na końcach przedziału, korzystając z symetrii wykresu względem
    prostej x=p.
  bloom_level: analiza
- statement: Wyznaczyć zbiór wartości funkcji kwadratowej zawężonej do przedziału domkniętego i wykorzystać
    go do rozstrzygania, czy dana wartość jest przyjmowana.
  bloom_level: zastosowanie
- statement: Zbudować model kwadratowy sytuacji praktycznej wraz z przedziałem dopuszczalnych wartości
    zmiennej i wyznaczyć rozwiązanie optymalne z interpretacją.
  bloom_level: synteza
- statement: Wykryć i poprawić typowy błąd polegający na podaniu q jako wartości ekstremalnej, gdy wierzchołek
    leży poza przedziałem.
  bloom_level: ocena
misconceptions:
- name: Automatyczne podawanie q jako wartości ekstremalnej
  incorrect_reasoning: '''Funkcja kwadratowa ma najmniejszą wartość w wierzchołku, więc w przedziale ⟨2,4⟩
    dla f(x)=-2x^2+4x+5 największa wartość to q=7.'''
  correct_reasoning: 'Wartość q jest przyjmowana tylko wtedy, gdy p należy do rozważanego przedziału.
    Tu p=1∉⟨2,4⟩, więc trzeba użyć monotoniczności i policzyć wartości na końcach: f_max=f(2)=5.'
  severity: 5
- name: Mylenie p z q (argumentu z wartością)
  incorrect_reasoning: '''Najmniejsza wartość funkcji f(x)=x^2-4x+1 w ⟨0,3⟩ wynosi 2, bo p=2.'''
  correct_reasoning: p=2 to miejsce (argument), w którym wartość jest najmniejsza; sama wartość to f(2)=-3.
    W odpowiedzi podajemy wartość funkcji, ewentualnie dopisując, dla jakiego x jest przyjmowana.
  severity: 4
- name: Pominięcie znaku a
  incorrect_reasoning: '''W wierzchołku zawsze jest minimum, więc f(p) to wartość najmniejsza.'''
  correct_reasoning: Przy a>0 w wierzchołku jest minimum, ale przy a<0 – maksimum. Znak a trzeba sprawdzić
    na samym początku.
  severity: 4
- name: Liczenie wartości tylko na końcach przedziału
  incorrect_reasoning: '''Wystarczy policzyć f(m) i f(n) i wybrać większą oraz mniejszą.'''
  correct_reasoning: To poprawne wyłącznie wtedy, gdy p∉⟨m,n⟩. Gdy wierzchołek leży w przedziale, jedna
    z wartości skrajnych jest przyjmowana właśnie w p i pominięcie f(p) daje błędny wynik.
  severity: 5
- name: Założenie, że prawy koniec daje większą wartość
  incorrect_reasoning: '''f rośnie, bo to parabola, więc największa wartość jest zawsze w prawym końcu
    przedziału.'''
  correct_reasoning: O tym, który koniec daje wartość większą, decyduje znak a oraz odległości |m-p| i
    |n-p| (dla a>0 dalszy koniec od p daje wartość większą, dla a<0 – mniejszą). Trzeba porównać konkretne
    wartości lub odległości.
  severity: 3
- name: Traktowanie przedziału otwartego jak domkniętego
  incorrect_reasoning: '''W przedziale (0,3) funkcja f(x)=x^2-4x+1 przyjmuje wartość największą 1 dla
    x=0.'''
  correct_reasoning: Do przedziału otwartego końce nie należą, więc f(0) nie jest wartością funkcji na
    tym zbiorze; przy takim przedziale wartość największa może w ogóle nie istnieć. Algorytm z końcami
    działa dla przedziałów domkniętych.
  severity: 3
- name: Błąd znaku we wzorach na wierzchołek
  incorrect_reasoning: '''p=b/(2a) oraz q=Δ/(4a).'''
  correct_reasoning: Poprawnie p=-b/(2a) i q=-Δ/(4a). Najprościej uniknąć błędu, licząc q jako f(p) przez
    podstawienie do wzoru funkcji – daje to też naturalną kontrolę rachunków.
  severity: 4
- name: Ignorowanie ograniczeń z treści w zadaniach optymalizacyjnych
  incorrect_reasoning: '''Pole prostokąta o obwodzie 24 jest największe dla x=6, więc odpowiedź to 36
    cm², niezależnie od warunku 2≤x≤5.'''
  correct_reasoning: 'Warunki z treści wyznaczają przedział zmiennej. Jeśli x=6 nie należy do ⟨2,5⟩, maksimum
    trzeba szukać na końcach: P(5)=35 cm².'
  severity: 4
- name: Podawanie zbioru wartości z całej dziedziny zamiast z przedziału
  incorrect_reasoning: '''Zbiór wartości f(x)=-(x+1)^2+4 w ⟨-4,0⟩ to (-∞,4⟩, bo taki jest zbiór wartości
    tej funkcji.'''
  correct_reasoning: 'Zawężenie dziedziny zawęża zbiór wartości: na ⟨-4,0⟩ wartości zmieniają się od f_min=-5
    do f_max=4, więc zbiorem wartości jest ⟨-5,4⟩.'
  severity: 3
