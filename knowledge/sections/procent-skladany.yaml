section: procent-skladany
name: Procent składany, lokaty i modele wykładnicze
scope: 'Powers and roots in practice: compound interest, deposit growth, loan cost, exponential decay;
  setting up and reading a growth/decay model.'
requirements:
- I.8
spec:
  agent: claude
  model: claude-opus-5
  prompt_version: m4-sec-v1
  written_at: '2026-08-28T14:08:21.569340'
  approved_at: '2026-08-28T18:28:01.705951'
  approved_by: reviewer
concepts:
- name: Procent i ułamek dziesiętny p%
  description: p% oznacza p setnych, czyli p% = p/100. Obliczenie p% liczby a to a·p/100.
  explanation: W zadaniach o lokatach i kredytach zawsze najpierw zamieniamy procent na ułamek (np. 4%
    → 0,04; 0,5% → 0,005; 12,5% → 0,125). Wszystkie dalsze wzory operują na ułamkach, nie na 'gołych'
    liczbach procentowych.
  difficulty: 1
- name: Punkt procentowy
  description: 'Jednostka różnicy dwóch wielkości wyrażonych w procentach: wzrost oprocentowania z 3%
    na 5% to wzrost o 2 punkty procentowe, ale o 66,7% (wartości względnej).'
  explanation: 'Myśl tak: ''punkt procentowy'' opisuje różnicę odjęciem, ''procent'' opisuje zmianę względną
    (dzieleniem). Bank zmieniający 3% na 5% podnosi stawkę o 2 p.p.'
  difficulty: 2
- name: Kapitał początkowy K₀ i kapitał końcowy Kₙ
  description: K₀ to kwota wpłacona (lub początkowa wartość obiektu), Kₙ to kwota po n okresach naliczania.
  explanation: 'Każde zadanie sprowadza się do relacji między czterema wielkościami: K₀, Kₙ, stopą (bazą
    q) i liczbą okresów n. Znając trzy, wyznaczamy czwartą.'
  difficulty: 1
- name: Czynnik (baza) wzrostu q
  description: 'Liczba, przez którą mnożymy wielkość w każdym okresie: przy wzroście o p% mamy q = 1 +
    p/100, przy spadku o p% mamy q = 1 − p/100.'
  explanation: To najważniejsze pojęcie sekcji. Zmiana procentowa = mnożenie przez stałą liczbę. Wzrost
    o 7% → ·1,07; spadek o 7% → ·0,93; podwojenie → ·2; spadek o połowę → ·0,5.
  difficulty: 2
- name: Procent prosty
  description: 'Odsetki naliczane w każdym okresie zawsze od kapitału początkowego: Kₙ = K₀(1 + n·p/100).'
  explanation: 'Odsetki nie ''pracują'' dalej — są odkładane na bok. Model liniowy: przyrost co okres
    jest stały.'
  difficulty: 2
- name: Procent składany (kapitalizacja odsetek)
  description: 'Odsetki dopisywane na koniec każdego okresu powiększają kapitał i w następnym okresie
    same przynoszą odsetki: Kₙ = K₀·qⁿ.'
  explanation: 'Model wykładniczy: przyrost co okres jest stały procentowo, ale rosnący kwotowo. Dlatego
    pojawiają się potęgi, a przy szukaniu stopy — pierwiastki.'
  difficulty: 2
- name: Okres kapitalizacji
  description: 'Odstęp czasu, po którym bank dopisuje odsetki: roczny, półroczny, kwartalny, miesięczny,
    dzienny.'
  explanation: Im częstsza kapitalizacja, tym więcej okresów n i tym mniejsza stopa w jednym okresie —
    ale efekt końcowy jest nieco większy, bo odsetki szybciej zaczynają pracować.
  difficulty: 2
- name: Roczna stopa nominalna a stopa okresowa
  description: Jeśli roczna stopa nominalna wynosi r (jako ułamek), a kapitalizacja następuje m razy w
    roku, to stopa jednego okresu wynosi r/m.
  explanation: 'Standardowa umowa: ''oprocentowanie 6% w skali roku, kapitalizacja kwartalna'' znaczy
    1,5% co kwartał, a w t latach jest 4t okresów.'
  difficulty: 3
- name: Efektywna roczna stopa procentowa
  description: 'Rzeczywisty procent, o jaki kapitał urośnie w ciągu roku: r_ef = (1 + r/m)^m − 1.'
  explanation: Służy do porównywania ofert o różnej częstotliwości kapitalizacji. Zawsze r_ef ≥ r, z równością
    tylko przy kapitalizacji rocznej.
  difficulty: 3
- name: Podatek od zysków kapitałowych (19%)
  description: Podatek pobierany od samych odsetek (zysku), a nie od całego kapitału; po opodatkowaniu
    inwestor otrzymuje 81% odsetek.
  explanation: 'Najpierw policz odsetki brutto Kₙ − K₀, potem pomnóż przez 0,81. Alternatywnie: stopa
    netto jednego okresu to 0,81·p przy kapitalizacji z podatkiem pobieranym co okres.'
  difficulty: 3
- name: Model wykładniczy wzrostu/zaniku
  description: Wielkość opisana wzorem W(n) = W₀·qⁿ, gdzie q > 1 oznacza wzrost, a 0 < q < 1 zanik (rozpad,
    amortyzacja, spadek wartości).
  explanation: 'Czytanie modelu: W₀ to wartość początkowa (dla n = 0), q mówi, co dzieje się w jednej
    jednostce czasu, n liczy jednostki. Ustawiając model, pytaj: ''co to jest jedna jednostka czasu?''
    i ''przez ile mnożę?''.'
  difficulty: 2
- name: Amortyzacja (utrata wartości)
  description: 'Coroczny spadek wartości dobra o ustalony procent: W(n) = W₀(1 − p/100)ⁿ.'
  explanation: 'Typowy przykład: samochód tracący 15% wartości rocznie — po roku 0,85·W₀, po dwóch 0,85²·W₀,
    a nie 0,70·W₀.'
  difficulty: 2
- name: Okres połowicznego zaniku (połowicznego rozpadu)
  description: 'Czas T, po którym wielkość maleje do połowy: W(t) = W₀·(1/2)^(t/T).'
  explanation: Wykładnik t/T zlicza, ile razy 'zmieściła się' połowa. Analogicznie działa czas podwojenia
    kapitału z (1/2) zamienionym na 2.
  difficulty: 3
- name: Inflacja i wartość realna
  description: Inflacja i% rocznie oznacza, że ceny mnożą się przez (1 + i/100); realny zysk z lokaty
    to porównanie czynnika wzrostu kapitału z czynnikiem wzrostu cen.
  explanation: Kapitał rośnie realnie tylko wtedy, gdy (1 + r) > (1 + i). Siła nabywcza kwoty K po n latach
    inflacji to K/(1 + i)ⁿ.
  difficulty: 3
- name: 'Kredyt: kapitał, rata, koszt kredytu'
  description: Kwota pożyczona (kapitał), rata to okresowa spłata, a koszt kredytu = suma wszystkich rat
    i opłat − kwota pożyczona.
  explanation: Koszt kredytu to po prostu 'ile oddajesz ponad to, co wziąłeś'. Wliczamy prowizję, ubezpieczenie
    i odsetki.
  difficulty: 2
- name: Prowizja
  description: Jednorazowa opłata banku, zwykle procent kwoty kredytu, doliczana do kosztu lub potrącana
    z wypłacanej kwoty.
  explanation: 'Uważaj na sformułowanie: ''prowizja doliczona do kredytu'' zwiększa kwotę, od której liczone
    są odsetki; ''potrącona z wypłaty'' zmniejsza to, co dostajesz do ręki.'
  difficulty: 3
- name: Powiązanie potęg i pierwiastków z modelem
  description: Z równania Kₙ = K₀qⁿ wynika q = ⁿ√(Kₙ/K₀), czyli pierwiastek n-tego stopnia (potęga o wykładniku
    1/n) odzyskuje stopę z całkowitego wzrostu.
  explanation: Ilekroć znasz wzrost łączny i liczbę okresów, a szukasz stopy w jednym okresie — pierwiastkujesz.
    To bezpośrednie zastosowanie własności potęgowania (qⁿ)^(1/n) = q.
  difficulty: 3
- name: Logarytm jako narzędzie do wyznaczania czasu
  description: Rozwiązanie równania qⁿ = a (q > 0, q ≠ 1, a > 0) to n = log a / log q.
  explanation: 'Gdy niewiadoma siedzi w wykładniku, logarytmujemy obie strony. Na poziomie podstawowym
    równie dobrze działa metoda kolejnych prób: liczymy q¹, q², q³… aż przekroczymy szukany poziom.'
  difficulty: 3
formulas:
- name: Zmiana o p procent
  latex_raw: a_{\text{nowe}} = a\left(1 \pm \frac{p}{100}\right)
  conditions: znak '+' dla wzrostu, '−' dla spadku; p ≥ 0, dla spadku dodatkowo p ≤ 100
  description: 'Podstawa wszystkich dalszych wzorów: zmiana procentowa to mnożenie.'
- name: Procent prosty
  latex_raw: K_n = K_0\left(1 + n\cdot\frac{p}{100}\right)
  conditions: odsetki p% za okres nie są dopisywane do kapitału, n — liczba okresów
  description: Model liniowy; w zadaniach maturalnych pojawia się dla porównania ze składanym.
- name: Procent składany (kapitalizacja raz na okres)
  latex_raw: K_n = K_0\left(1 + \frac{p}{100}\right)^{n}
  conditions: p% — oprocentowanie jednego okresu kapitalizacji, n — liczba pełnych okresów
  description: Bez uwzględnienia podatku.
- name: Procent składany przy m kapitalizacjach rocznie
  latex_raw: K = K_0\left(1 + \frac{r}{m}\right)^{m t}
  conditions: r — roczna stopa nominalna jako ułamek, m — liczba kapitalizacji w roku, t — liczba lat
    (mt musi być liczbą całkowitą okresów)
  description: m = 1 rocznie, 2 półrocznie, 4 kwartalnie, 12 miesięcznie.
- name: Efektywna stopa roczna
  latex_raw: r_{ef} = \left(1 + \frac{r}{m}\right)^{m} - 1
  conditions: r — stopa nominalna roczna, m — liczba kapitalizacji w roku
  description: Służy do porównywania lokat o różnych okresach kapitalizacji.
- name: Kapitał po opodatkowaniu zysku
  latex_raw: K_{netto} = K_0 + 0{,}81\,(K_n - K_0)
  conditions: podatek 19% pobierany jednorazowo od całości odsetek na koniec inwestycji
  description: Podatek dotyczy wyłącznie zysku K_n − K_0.
- name: Kapitalizacja z podatkiem pobieranym co okres
  latex_raw: K_n = K_0\left(1 + 0{,}81\cdot\frac{p}{100}\right)^{n}
  conditions: podatek 19% potrącany od odsetek każdego okresu przed ich dopisaniem
  description: Daje wynik nieco inny niż podatek naliczony raz na końcu.
- name: Model zaniku wykładniczego
  latex_raw: W(n) = W_0\left(1 - \frac{p}{100}\right)^{n}
  conditions: 0 < p < 100, n — liczba okresów spadku o p%
  description: Amortyzacja, spadek wartości, ubytek masy.
- name: Okres połowicznego zaniku
  latex_raw: W(t) = W_0\cdot\left(\tfrac{1}{2}\right)^{t/T}
  conditions: T — czas, po którym wielkość maleje o połowę; t i T w tych samych jednostkach
  description: 'Analogicznie czas podwojenia: W(t) = W_0·2^{t/T}.'
- name: Wyznaczanie stopy z całkowitego wzrostu
  latex_raw: q = \sqrt[n]{\dfrac{K_n}{K_0}}, \qquad p\% = (q-1)\cdot 100\%
  conditions: K_0 > 0, K_n > 0, n ∈ ℕ⁺, stała stopa w każdym okresie
  description: Bezpośrednie użycie pierwiastka n-tego stopnia.
- name: Wyznaczanie liczby okresów
  latex_raw: n = \frac{\log\left(\frac{K_n}{K_0}\right)}{\log q}
  conditions: q > 0, q ≠ 1, K_n/K_0 > 0
  description: 'Alternatywa dla poziomu podstawowego: kolejne mnożenia i porównanie.'
- name: Złożenie dwóch zmian procentowych
  latex_raw: q = \left(1 + \frac{p_1}{100}\right)\left(1 + \frac{p_2}{100}\right)
  conditions: zmiany następują kolejno po sobie, każda liczona od aktualnej wartości
  description: Łączna zmiana procentowa to (q − 1)·100%, na ogół różna od p₁ + p₂.
- name: Koszt kredytu
  latex_raw: K_{\text{koszt}} = n\cdot R + \text{prowizja} + \text{inne opłaty} - K_{\text{pożyczone}}
  conditions: n rat po R złotych, wszystkie opłaty w tej samej walucie i wyrażone kwotowo
  description: 'Koszt kredytu jako procent kwoty pożyczonej: K_koszt/K_pożyczone · 100%.'
- name: Wartość realna kwoty po n latach inflacji
  latex_raw: W_{real} = \frac{K_n}{\left(1 + \frac{i}{100}\right)^{n}}
  conditions: i% — stała roczna inflacja
  description: Porównuje siłę nabywczą przyszłej kwoty z dzisiejszymi cenami.
methods:
- name: Ustawianie modelu wykładniczego z treści zadania
  when_to_use: Zawsze na początku zadania o lokacie, kredycie, rozpadzie lub spadku wartości — zanim cokolwiek
    policzysz.
  steps:
  - Wypisz wartość początkową K₀ (kwota wpłacona, cena nowego auta, masa substancji).
  - Ustal, co jest JEDNYM okresem (rok, kwartał, miesiąc, okres połowicznego rozpadu).
  - 'Zamień oprocentowanie na stopę jednego okresu: przy kapitalizacji m razy w roku dziel roczną stopę
    nominalną przez m.'
  - 'Wyznacz czynnik q: q = 1 + stopa (wzrost) lub q = 1 − stopa (spadek).'
  - 'Policz liczbę okresów n = (czas trwania) : (długość jednego okresu).'
  - 'Zapisz model: Kₙ = K₀·qⁿ i dopiero teraz podstawiaj liczby.'
- name: Obliczanie kapitału końcowego lokaty z podatkiem
  when_to_use: Gdy dane są wpłata, oprocentowanie, częstotliwość kapitalizacji i czas, a pytanie brzmi
    'ile wypłaci właściciel lokaty'.
  steps:
  - Zbuduj model i policz kapitał brutto Kₙ = K₀·qⁿ.
  - 'Oblicz odsetki brutto: O = Kₙ − K₀.'
  - Pomnóż odsetki przez 0,81 (potrącenie 19% podatku), jeśli zadanie o podatku wspomina.
  - 'Dodaj odsetki netto do kapitału: K_netto = K₀ + 0,81·O.'
  - Zaokrąglij dopiero w ostatnim kroku, zwykle do groszy (2 miejsca po przecinku).
- name: Porównywanie dwóch ofert lokat
  when_to_use: Gdy oferty różnią się oprocentowaniem i częstotliwością kapitalizacji.
  steps:
  - Dla każdej oferty policz stopę jednego okresu r/m i liczbę okresów w roku m.
  - Policz czynnik roczny (1 + r/m)^m.
  - Odejmij 1 i zamień na procent — to efektywna stopa roczna.
  - Porównaj stopy efektywne (albo, przy jednakowym K₀ i czasie, po prostu kapitały końcowe).
  - Sformułuj odpowiedź podając, o ile złotych lub o ile punktów procentowych oferta jest lepsza.
- name: Wyznaczanie nieznanego oprocentowania (pierwiastkowanie)
  when_to_use: Gdy znasz kapitał początkowy, końcowy i liczbę okresów, a szukasz stopy procentowej.
  steps:
  - Zapisz równanie K₀·qⁿ = Kₙ.
  - Wyznacz qⁿ = Kₙ/K₀ (uprość ułamek).
  - 'Spierwiastkuj stopniem n: q = (Kₙ/K₀)^(1/n); przy n = 2 lub 3 często wychodzi ładna liczba (np. 1,21
    → 1,1).'
  - Oblicz p = (q − 1)·100%.
  - Sprawdź wynik, mnożąc K₀ przez q n razy.
- name: Wyznaczanie czasu (liczby okresów)
  when_to_use: Gdy pytanie brzmi 'po ilu latach kapitał przekroczy…', 'po ilu okresach zostanie mniej
    niż…'.
  steps:
  - Zapisz nierówność K₀·qⁿ > A (lub <) i podziel obustronnie przez K₀.
  - 'Metoda podstawowa: licz kolejno q, q², q³, … porównując z A/K₀, aż warunek zostanie spełniony po
    raz pierwszy.'
  - 'Metoda z logarytmem: n = log(A/K₀)/log q; dla wzrostu zaokrąglij w górę do liczby całkowitej, dla
    zaniku również w górę (pierwszy okres, w którym warunek zachodzi).'
  - Zinterpretuj n w jednostkach czasu (np. n = 6 kwartałów = 1,5 roku).
  - Sprawdź odpowiedź podstawieniem n i n − 1.
- name: Składanie kolejnych zmian procentowych
  when_to_use: Gdy cena/wartość zmienia się kilka razy z rzędu o różne procenty i pytamy o łączną zmianę.
  steps:
  - 'Zamień każdą zmianę na czynnik: wzrost o p% → 1 + p/100, spadek o p% → 1 − p/100.'
  - Pomnóż wszystkie czynniki w kolejności występowania (kolejność nie wpływa na wynik).
  - Odejmij 1 od iloczynu.
  - 'Zamień na procent: wynik dodatni to łączny wzrost, ujemny — łączny spadek.'
  - 'Odpowiedz precyzyjnie: ''wartość wzrosła o …%'' albo ''stanowi …% wartości początkowej''.'
- name: Obliczanie kosztu kredytu
  when_to_use: Gdy dane są kwota kredytu, liczba i wysokość rat oraz ewentualna prowizja.
  steps:
  - 'Policz sumę wszystkich rat: n·R (jeśli raty są równe).'
  - Dodaj prowizję i inne opłaty wyrażone kwotowo (prowizja p% od kwoty K to K·p/100).
  - Odejmij kwotę faktycznie pożyczoną — otrzymasz koszt kredytu.
  - 'Jeśli pytanie dotyczy procentu: podziel koszt przez kwotę pożyczoną i pomnóż przez 100%.'
  - Uważaj, czy prowizja została doliczona do kredytu (rośnie kwota do spłaty), czy potrącona z wypłaty
    (maleje kwota otrzymana).
- name: Czytanie i interpretowanie gotowego modelu W(t) = W₀·q^t
  when_to_use: Gdy w zadaniu podany jest wzór funkcji opisującej wzrost lub zanik i trzeba go zinterpretować.
  steps:
  - Podstaw t = 0, aby odczytać wartość początkową W₀.
  - 'Odczytaj q: jeśli q > 1, wielkość rośnie o (q − 1)·100% na jednostkę czasu; jeśli 0 < q < 1, maleje
    o (1 − q)·100%.'
  - Sprawdź jednostkę wykładnika — jeśli jest postaci t/T lub kt, przelicz, ile jednostek czasu przypada
    na jedno pomnożenie przez q.
  - Podstaw żądane t, aby obliczyć wartość, albo rozwiąż równanie/nierówność, aby znaleźć t.
examples:
- statement: Pan Adam wpłacił 8000 zł na dwuletnią lokatę o oprocentowaniu 5% w skali roku z kapitalizacją
    roczną. Oblicz kapitał po dwóch latach oraz kwotę, którą pan Adam faktycznie otrzyma po potrąceniu
    19% podatku od zysku.
  worked_solution: |-
    Model: K₀ = 8000, jeden okres = rok, stopa okresu 5% → q = 1,05, n = 2.
    K₂ = 8000·1,05² = 8000·1,1025 = 8820 zł.
    Odsetki brutto: 8820 − 8000 = 820 zł.
    Podatek: 19% z 820 = 0,19·820 = 155,80 zł.
    Odsetki netto: 820 − 155,80 = 664,20 zł (lub od razu 0,81·820 = 664,20 zł).
    Kwota wypłacona: 8000 + 664,20 = 8664,20 zł.
    Odpowiedź: kapitał brutto 8820 zł, do wypłaty 8664,20 zł.
    Uwaga: gdyby to był procent prosty, byłoby 8000·(1 + 2·0,05) = 8800 zł — o 20 zł mniej; ta różnica to właśnie 'odsetki od odsetek'.
  difficulty: 1
- statement: Bank A oferuje lokatę 6% w skali roku z kapitalizacją roczną, a bank B lokatę 6% w skali
    roku z kapitalizacją kwartalną. Klient wpłaca 10 000 zł na 1 rok. Która lokata jest korzystniejsza
    i o ile złotych? Podaj efektywną stopę roczną w banku B.
  worked_solution: |-
    Bank A: q = 1,06, n = 1 → K = 10000·1,06 = 10 600 zł.
    Bank B: kapitalizacja kwartalna, m = 4, stopa okresu = 6%/4 = 1,5% → q = 1,015, liczba okresów n = 4.
    K = 10000·1,015⁴.
    1,015² = 1,030225; 1,015⁴ = (1,030225)² ≈ 1,06136355.
    K ≈ 10 613,64 zł.
    Różnica: 10 613,64 − 10 600 = 13,64 zł na korzyść banku B.
    Efektywna stopa roczna w B: r_ef = 1,015⁴ − 1 ≈ 0,06136 = 6,14% (po zaokrągleniu do dwóch miejsc), czyli o ok. 0,14 punktu procentowego więcej niż nominalne 6%.
    Odpowiedź: korzystniejsza jest lokata B, o ok. 13,64 zł; jej stopa efektywna to ok. 6,14%.
  difficulty: 2
- statement: Wartość maszyny wynosiła 50 000 zł, a po trzech latach spadła do 25 600 zł, przy czym co
    roku malała o ten sam procent. (a) O ile procent rocznie traciła na wartości? (b) Po ilu pełnych latach
    od zakupu jej wartość spadnie poniżej 20 000 zł?
  worked_solution: |-
    (a) Model: W(n) = 50000·qⁿ, W(3) = 25600.
    50000·q³ = 25600 ⟹ q³ = 25600/50000 = 0,512.
    q = ∛0,512 = 0,8 (bo 0,8³ = 0,512).
    Zatem q = 1 − p/100 = 0,8, czyli p = 20%. Maszyna traciła 20% wartości rocznie.
    Sprawdzenie: 50000 → 40000 → 32000 → 25600. ✓
    (b) Szukamy najmniejszego n, dla którego 50000·0,8ⁿ < 20000, czyli 0,8ⁿ < 0,4.
    Kolejne potęgi: 0,8¹ = 0,8; 0,8² = 0,64; 0,8³ = 0,512; 0,8⁴ = 0,4096; 0,8⁵ = 0,32768 < 0,4.
    Pierwszy raz warunek zachodzi dla n = 5.
    (Logarytmicznie: n > log0,4/log0,8 ≈ (−0,3979)/(−0,0969) ≈ 4,1, więc n = 5.)
    Wartość po 4 latach: 50000·0,4096 = 20 480 zł (jeszcze powyżej), po 5 latach: 16 384 zł.
    Odpowiedź: (a) 20% rocznie, (b) po 5 latach.
  difficulty: 3
- statement: Pani Ewa zaciągnęła kredyt 24 000 zł. Bank pobrał prowizję 3% kwoty kredytu (doliczoną do
    kwoty do spłaty) i ustalił spłatę w 36 równych ratach po 780 zł. (a) Oblicz całkowity koszt kredytu.
    (b) Jaki procent pożyczonej kwoty stanowi ten koszt? (c) Gdyby zamiast kredytu pani Ewa odkładała
    te 24 000 zł na lokacie 4% rocznie z kapitalizacją roczną, po ilu latach kapitał przekroczyłby 30
    000 zł?
  worked_solution: |-
    (a) Suma rat: 36·780 = 28 080 zł.
    Prowizja: 3% z 24 000 = 0,03·24000 = 720 zł.
    Łącznie oddane bankowi: 28 080 + 720 = 28 800 zł.
    Koszt kredytu = 28 800 − 24 000 = 4800 zł.
    (b) 4800/24000 = 0,2 = 20% kwoty pożyczonej.
    (c) Model: K(n) = 24000·1,04ⁿ > 30000 ⟹ 1,04ⁿ > 1,25.
    1,04¹ = 1,04; 1,04² = 1,0816; 1,04³ ≈ 1,1249; 1,04⁴ ≈ 1,1699; 1,04⁵ ≈ 1,2167; 1,04⁶ ≈ 1,2653 > 1,25.
    Zatem n = 6.
    (Logarytmicznie: n > log1,25/log1,04 ≈ 0,0969/0,0170 ≈ 5,7 → n = 6.)
    Kapitał po 6 latach: 24000·1,2653 ≈ 30 367 zł > 30 000 zł, po 5 latach ≈ 29 200 zł < 30 000 zł.
    Odpowiedź: (a) 4800 zł, (b) 20%, (c) po 6 latach.
  difficulty: 3
- statement: Masa pewnego izotopu maleje zgodnie ze wzorem m(t) = m₀·(1/2)^(t/8), gdzie t wyrażone jest
    w dniach. Początkowo próbka ważyła 240 g. (a) Zinterpretuj liczby 1/2 i 8 we wzorze. (b) Ile izotopu
    zostanie po 24 dniach? (c) O ile procent maleje masa w ciągu jednego dnia (z dokładnością do 0,1%)?
    (d) Po ilu pełnych dniach zostanie mniej niż 20 g?
  worked_solution: |-
    (a) 1/2 to czynnik, przez który mnoży się masa w jednym okresie połowicznego rozpadu; 8 to długość tego okresu — co 8 dni masa maleje o połowę.
    (b) t = 24 → 24/8 = 3, więc m = 240·(1/2)³ = 240/8 = 30 g.
    (c) Czynnik dzienny: q = (1/2)^(1/8) = ⁸√0,5 ≈ 0,9170.
    Spadek: 1 − 0,9170 = 0,0830 ≈ 8,3% na dobę.
    (Sprawdzenie: 0,9170⁸ ≈ 0,5 ✓.)
    (d) Szukamy najmniejszego całkowitego t z warunkiem 240·(1/2)^(t/8) < 20, czyli (1/2)^(t/8) < 1/12.
    Porównajmy: (1/2)³ = 1/8 > 1/12, (1/2)⁴ = 1/16 < 1/12, więc t/8 musi być między 3 a 4, dokładniej t/8 > log₂12 ≈ 3,585, czyli t > 28,68.
    Można też iść dziennym czynnikiem: 240·0,9170^28 ≈ 20,6 g, 240·0,9170^29 ≈ 18,9 g.
    Odpowiedź: (a) połowa co 8 dni, (b) 30 g, (c) ok. 8,3% dziennie, (d) po 29 dniach.
  difficulty: 4
objectives:
- statement: Zamieniać opis słowny zmiany procentowej na czynnik wzrostu q = 1 ± p/100 i odwrotnie odczytywać
    procent zmiany z podanego czynnika.
  bloom_level: Rozumienie
- statement: Obliczać kapitał końcowy lokaty przy procencie składanym, dla różnych okresów kapitalizacji
    (rocznej, półrocznej, kwartalnej, miesięcznej).
  bloom_level: Zastosowanie
- statement: Uwzględniać 19% podatek od zysków kapitałowych i wyznaczać kwotę faktycznie wypłaconą właścicielowi
    lokaty.
  bloom_level: Zastosowanie
- statement: Odróżniać procent prosty od składanego i uzasadniać liczbowo, na czym polega różnica.
  bloom_level: Analiza
- statement: Wyznaczać nieznane oprocentowanie z zależności K₀·qⁿ = Kₙ, korzystając z pierwiastka n-tego
    stopnia i własności potęgowania.
  bloom_level: Zastosowanie
- statement: Wyznaczać liczbę okresów potrzebną do osiągnięcia zadanego kapitału lub poziomu wielkości
    — metodą kolejnych prób lub za pomocą logarytmu.
  bloom_level: Zastosowanie
- statement: Obliczać efektywną roczną stopę procentową i na jej podstawie porównywać oferty lokat o różnej
    częstotliwości kapitalizacji.
  bloom_level: Analiza
- statement: Składać kilka następujących po sobie zmian procentowych i podawać łączną zmianę w procentach.
  bloom_level: Zastosowanie
- statement: Obliczać całkowity koszt kredytu (raty, prowizja, opłaty) oraz wyrażać go jako procent pożyczonej
    kwoty.
  bloom_level: Zastosowanie
- statement: Budować model wykładniczy zaniku (amortyzacja, rozpad, spadek wartości) i obliczać wartość
    po zadanym czasie.
  bloom_level: Tworzenie
- statement: 'Interpretować parametry gotowego modelu W(t) = W₀·q^(t/T): wartość początkową, czynnik zmiany,
    okres połowicznego zaniku lub podwojenia.'
  bloom_level: Rozumienie
- statement: Oceniać realny zysk z inwestycji z uwzględnieniem inflacji i formułować wniosek o zmianie
    siły nabywczej kapitału.
  bloom_level: Ocenianie
misconceptions:
- name: Dodawanie procentów zamiast mnożenia czynników
  incorrect_reasoning: Lokata 10% rocznie przez 3 lata daje 30% zysku, więc 1000 zł urośnie do 1300 zł.
  correct_reasoning: 'Przy kapitalizacji odsetki dopisują się do kapitału: 1000·1,1³ = 1331 zł, czyli
    33,1%. Sumowanie procentów odpowiada procentowi prostemu, a nie składanemu.'
  severity: 5
- name: '''Wzrost o p%, potem spadek o p% wraca do początku'''
  incorrect_reasoning: Cena wzrosła o 20%, a potem spadła o 20%, więc jest taka sama jak na początku.
  correct_reasoning: 'Czynniki mnożą się: 1,2·0,8 = 0,96, czyli cena jest o 4% niższa. Procenty liczone
    są od różnych podstaw.'
  severity: 4
- name: Mylenie procentu z punktem procentowym
  incorrect_reasoning: Oprocentowanie wzrosło z 2% do 3%, czyli wzrosło o 1%.
  correct_reasoning: Wzrosło o 1 punkt procentowy, ale o 50% wartości względnej (1/2 = 50%). Różnicę stawek
    podajemy w punktach procentowych.
  severity: 3
- name: Zapominanie o podziale stopy rocznej przez liczbę kapitalizacji
  incorrect_reasoning: Oprocentowanie 8% rocznie, kapitalizacja kwartalna, 2 lata → K = K₀·1,08⁸.
  correct_reasoning: 'Stopa jednego kwartału to 8%/4 = 2%, a liczba kwartałów to 8: K = K₀·1,02⁸. Podnosimy
    do potęgi stopę okresową, nie roczną.'
  severity: 5
- name: Naliczanie podatku od całego kapitału
  incorrect_reasoning: Od 10 600 zł na koncie bank pobierze 19%, czyli zostanie 8586 zł.
  correct_reasoning: Podatek 19% dotyczy wyłącznie zysku (odsetek). Przy wpłacie 10 000 zł odsetki to
    600 zł, podatek 114 zł, do wypłaty 10 486 zł.
  severity: 5
- name: Zaokrąglanie po każdym okresie
  incorrect_reasoning: Po pierwszym roku wychodzi 1053,71 zł — zaokrąglę do 1054 zł i tym mnożę dalej.
  correct_reasoning: Zaokrąglenia pośrednie kumulują błąd. Prowadzimy rachunek na dokładnych wartościach
    (najlepiej jednym działaniem K₀·qⁿ), a zaokrąglamy dopiero wynik końcowy, zwykle do groszy.
  severity: 3
- name: Mylenie 'ile procent' z 'o ile procent'
  incorrect_reasoning: Wartość spadła z 50 000 do 40 000, więc stanowi 20% wartości początkowej.
  correct_reasoning: Stanowi 40000/50000 = 80% wartości początkowej, a SPADŁA o 20%. 'Ile procent' → iloraz
    nowej i starej, 'o ile procent' → iloraz różnicy i starej wartości.
  severity: 4
- name: Dzielenie zamiast pierwiastkowania przy szukaniu stopy
  incorrect_reasoning: Kapitał wzrósł łącznie o 21% w ciągu 2 lat, więc rocznie rósł o 21%/2 = 10,5%.
  correct_reasoning: q² = 1,21, więc q = √1,21 = 1,1, czyli 10% rocznie. Stopę okresową odzyskuje się
    pierwiastkiem n-tego stopnia, nie dzieleniem.
  severity: 4
- name: Złe zaokrąglenie liczby okresów
  incorrect_reasoning: Z logarytmu wyszło n ≈ 4,1, więc odpowiedź to 4 lata.
  correct_reasoning: 'Po 4 latach warunek jeszcze nie jest spełniony; odsetki dopisywane są na koniec
    pełnego okresu, więc bierzemy najbliższą większą liczbę całkowitą: 5 lat. Zawsze warto sprawdzić n
    i n − 1 podstawieniem.'
  severity: 4
- name: Utożsamianie kosztu kredytu z sumą rat
  incorrect_reasoning: 36 rat po 780 zł to 28 080 zł — taki jest koszt kredytu.
  correct_reasoning: 'Koszt kredytu to nadwyżka ponad pożyczoną kwotę: 28 080 + prowizja − 24 000. Suma
    rat obejmuje również zwrot kapitału.'
  severity: 4
- name: Traktowanie zaniku wykładniczego jak liniowego
  incorrect_reasoning: Samochód traci 15% wartości rocznie, więc po 7 latach straci ponad 100% i będzie
    bezwartościowy.
  correct_reasoning: 'Co roku 15% liczone jest od AKTUALNEJ wartości: po 7 latach zostaje 0,85⁷ ≈ 32%
    wartości początkowej. Model wykładniczy nigdy nie osiąga zera.'
  severity: 4
- name: Ignorowanie inflacji przy ocenie zysku
  incorrect_reasoning: Lokata 3% rocznie zawsze powiększa moją siłę nabywczą.
  correct_reasoning: 'Trzeba porównać czynnik wzrostu kapitału z czynnikiem wzrostu cen: przy inflacji
    5% mamy 1,03/1,05 < 1, więc realnie kapitał traci na wartości.'
  severity: 3
