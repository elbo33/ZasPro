section: regula-mnozenia-i-dodawania
name: Reguła mnożenia i reguła dodawania
scope: The multiplication rule and the addition rule, and using them together, for a sequence of choices
  with any number of steps.
requirements:
- XI.2
spec:
  agent: claude
  model: claude-opus-5
  prompt_version: m4-sec-v1
  written_at: '2026-08-28T17:44:27.350187'
  approved_at: '2026-08-28T18:28:26.200300'
  approved_by: reviewer
concepts:
- name: Zliczanie (kombinatoryka) — o co chodzi
  description: Zliczanie to wyznaczanie liczby obiektów spełniających określone warunki (np. liczby kodów,
    liczb, tras, zestawów) bez wypisywania ich wszystkich.
  explanation: 'Zamiast wypisywać setki możliwości, opisujemy sposób ich powstawania: obiekt powstaje
    w wyniku serii decyzji. Liczbę obiektów wyliczamy z liczby decyzji na każdym etapie. Kluczowe pytanie
    brzmi zawsze: „jak jednoznacznie zbudować taki obiekt krok po kroku?”.'
  difficulty: 1
- name: Doświadczenie (konstrukcja) wieloetapowe
  description: 'Sytuacja, w której obiekt powstaje przez wykonanie kolejno kilku czynności: etap 1, etap
    2, …, etap k.'
  explanation: 'Np. „wybieram bluzkę, potem spodnie, potem buty” albo „ustawiam cyfrę setek, potem dziesiątek,
    potem jedności”. Dobre rozbicie na etapy to połowa sukcesu: etapy muszą razem wyznaczać obiekt jednoznacznie
    i każdy obiekt musi powstawać dokładnie raz.'
  difficulty: 2
- name: Reguła mnożenia
  description: Jeśli obiekt powstaje w k etapach i przy każdym ustalonym przebiegu wcześniejszych etapów
    etap 1. można wykonać na n₁ sposobów, etap 2. na n₂ sposobów, …, etap k. na n_k sposobów, to wszystkich
    obiektów jest n₁·n₂·…·n_k.
  explanation: 'Myśl o tym tak: każdy sposób wykonania pierwszego etapu „rozgałęzia się” na n₂ sposobów
    drugiego itd. Ważne słowa: „i potem” — gdy etapy następują JEDEN PO DRUGIM, mnożymy. Warunek istotny:
    liczba możliwości na danym etapie nie może zależeć od tego, co konkretnie wybrano wcześniej (może
    zależeć tylko od numeru etapu).'
  difficulty: 2
- name: Reguła dodawania
  description: Jeśli zbiór obiektów rozbijemy na przypadki parami rozłączne (żaden obiekt nie należy do
    dwóch przypadków), o liczebnościach m₁, m₂, …, m_r, to wszystkich obiektów jest m₁ + m₂ + … + m_r.
  explanation: 'Słowo-klucz: „albo”. Gdy obiekt jest tego typu ALBO tamtego typu i te typy się wykluczają,
    liczby przypadków dodajemy. Rozłączność trzeba sprawdzić, bo inaczej coś policzymy dwa razy.'
  difficulty: 2
- name: Rozłączność przypadków
  description: Przypadki są rozłączne, gdy żaden zliczany obiekt nie spełnia warunków dwóch różnych przypadków
    jednocześnie.
  explanation: 'Testuj tak: weź konkretny obiekt i zapytaj „do ilu moich przypadków pasuje?”. Odpowiedź
    musi brzmieć: dokładnie do jednego. Podział „liczby parzyste / liczby podzielne przez 3” NIE jest
    rozłączny (6 pasuje do obu); podział „ostatnia cyfra to 0 / ostatnia cyfra to 2, 4, 6, 8” jest rozłączny.'
  difficulty: 3
- name: Łączne stosowanie obu reguł
  description: 'Typowe zadanie: dzielimy zbiór na rozłączne przypadki (reguła dodawania), w każdym przypadku
    liczbę obiektów wyznaczamy regułą mnożenia, a wyniki sumujemy.'
  explanation: Schemat „suma iloczynów”. Stosuj go, gdy jakiś warunek (np. parzystość, obecność zera,
    zakaz powtórzeń) sprawia, że liczba możliwości na jednym etapie zależy od wyboru z innego etapu. Rozbicie
    na przypadki likwiduje tę zależność.
  difficulty: 3
- name: Drzewo możliwości (drzewko)
  description: 'Graficzny zapis konstrukcji wieloetapowej: z każdego węzła wychodzą krawędzie odpowiadające
    możliwym wyborom na kolejnym etapie; obiekty to ścieżki od korzenia do liścia.'
  explanation: 'Drzewko to „widoczna” reguła mnożenia: liczba liści to iloczyn liczb rozgałęzień, gdy
    rozgałęzienia są równoliczne, a suma po gałęziach, gdy nie są. Rysuj je przy małej liczbie możliwości
    albo jako szkic pomocniczy przy trudnym zadaniu.'
  difficulty: 2
- name: Wybór z powtórzeniami
  description: Sytuacja, w której ten sam element może zostać wybrany na kilku etapach (np. cyfry w kodzie
    PIN mogą się powtarzać).
  explanation: 'Wtedy na każdym etapie mamy tyle samo możliwości: n·n·…·n = n^k. Sygnały w treści: „cyfry
    mogą się powtarzać”, „ze zwracaniem”, brak jakiejkolwiek wzmianki o zakazie powtórzeń (uwaga: w zadaniu
    musi być to jasno powiedziane).'
  difficulty: 2
- name: Wybór bez powtórzeń
  description: Sytuacja, w której raz użyty element nie może być użyty ponownie (np. „o różnych cyfrach”,
    losowanie bez zwracania, ustawianie różnych osób w rzędzie).
  explanation: 'Na każdym kolejnym etapie liczba możliwości maleje o 1: n·(n−1)·(n−2)·… Liczba możliwości
    nie zależy od tego, KTÓRE elementy już zużyto, tylko ILE — dlatego reguła mnożenia nadal działa.'
  difficulty: 2
- name: Ustawienia wszystkich elementów (permutacje)
  description: Ustawienie n różnych elementów w rzędzie można wykonać na n·(n−1)·…·2·1 = n! sposobów.
  explanation: To szczególny przypadek reguły mnożenia bez powtórzeń, gdy zużywamy wszystkie elementy.
    Przydaje się przy zadaniach typu „na ile sposobów można ustawić 5 książek na półce”.
  difficulty: 2
- name: Metoda miejsc („kratek”)
  description: Zapis konstrukcji jako ciągu pustych miejsc, w których wpisujemy liczby możliwości dla
    kolejnych pozycji, a następnie mnożymy.
  explanation: 'Np. liczba czterocyfrowa o różnych cyfrach: |9|9|8|7| → 9·9·8·7. Zawsze zaczynaj wypełnianie
    od miejsca NAJBARDZIEJ OGRANICZONEGO (np. pierwsza cyfra ≠ 0, ostatnia cyfra parzysta), a nie od lewej
    do prawej.'
  difficulty: 3
- name: Zliczanie przez dopełnienie
  description: Liczbę obiektów spełniających warunek obliczamy jako (liczba wszystkich obiektów) − (liczba
    obiektów niespełniających warunku).
  explanation: 'Opłaca się, gdy warunek brzmi „co najmniej jeden…”, bo zaprzeczenie („ani jeden”) jest
    zwykle prostym iloczynem. Uwaga: „wszystkie” i „niespełniające” muszą dotyczyć dokładnie tego samego
    zbioru wyjściowego.'
  difficulty: 3
- name: Rola kolejności
  description: Dwa obiekty uznajemy za różne, jeśli różnią się jakąś decyzją; przy zliczaniu ciągów (kodów,
    liczb, ustawień) kolejność wyborów ma znaczenie.
  explanation: Reguła mnożenia w naturalny sposób zlicza obiekty uporządkowane. Jeśli treść mówi o zestawie,
    w którym kolejność nie ma znaczenia (np. wybór dwóch osób do pary bez ról), iloczyn policzy każdy
    zestaw kilka razy — trzeba to zauważyć i skorygować (np. podzielić przez 2 przy dwóch nierozróżnialnych
    rolach).
  difficulty: 4
- name: Warunki podzielności w zadaniach o liczbach
  description: 'Typowe warunki: liczba parzysta (ostatnia cyfra 0, 2, 4, 6, 8), podzielna przez 5 (ostatnia
    cyfra 0 lub 5), podzielna przez 10 (ostatnia cyfra 0).'
  explanation: Takie warunki dotyczą JEDNEGO miejsca (najczęściej ostatniego) — dlatego to miejsce wypełniamy
    w pierwszej kolejności. W liczbach o różnych cyfrach cyfra 0 często wymusza podział na przypadki,
    bo „zjada” możliwość z pierwszego miejsca.
  difficulty: 3
formulas:
- name: Reguła mnożenia
  latex_raw: N = n_1 \cdot n_2 \cdot \ldots \cdot n_k
  conditions: obiekt powstaje w k kolejnych etapach; liczba możliwości n_i na i-tym etapie jest taka sama
    niezależnie od konkretnych wyborów dokonanych wcześniej; różne ciągi wyborów dają różne obiekty
  description: 'Podstawowe narzędzie: „i potem” → mnożymy.'
- name: Reguła dodawania
  latex_raw: N = m_1 + m_2 + \ldots + m_r
  conditions: zbiór zliczanych obiektów rozbity na r przypadków parami rozłącznych, obejmujących wszystkie
    obiekty
  description: „albo” → dodajemy. Konieczna rozłączność i wyczerpanie wszystkich możliwości.
- name: Liczba ciągów k-wyrazowych z n elementów (z powtórzeniami)
  latex_raw: N = n^k
  conditions: na każdym z k etapów wybieramy jeden z tych samych n elementów, powtórzenia dozwolone
  description: 'Np. liczba kodów PIN o 4 cyfrach: 10^4 = 10000.'
- name: Liczba ciągów k-wyrazowych bez powtórzeń
  latex_raw: N = n\cdot (n-1)\cdot (n-2)\cdot \ldots \cdot (n-k+1)
  conditions: k ≤ n, elementy nie mogą się powtarzać, kolejność ma znaczenie
  description: Iloczyn ma dokładnie k czynników.
- name: Liczba ustawień n różnych elementów
  latex_raw: N = n! = n\cdot(n-1)\cdot\ldots\cdot 2\cdot 1
  conditions: wszystkie n elementów rozróżnialnych, ustawiane w rzędzie (kolejność istotna)
  description: Szczególny przypadek poprzedniego wzoru dla k = n.
- name: Zliczanie przez dopełnienie
  latex_raw: N_{\text{warunek}} = N_{\text{wszystkie}} - N_{\text{brak warunku}}
  conditions: oba zbiory liczone w obrębie tego samego zbioru wszystkich obiektów
  description: Standard przy sformułowaniu „co najmniej jeden”.
- name: Liczba liczb k-cyfrowych o dowolnych cyfrach
  latex_raw: N = 9\cdot 10^{\,k-1}
  conditions: zapis dziesiętny, pierwsza cyfra różna od 0, cyfry mogą się powtarzać
  description: Np. liczb trzycyfrowych jest 9·10·10 = 900.
- name: Suma iloczynów (obie reguły razem)
  latex_raw: N = \sum_{i=1}^{r} \left(n_1^{(i)}\cdot n_2^{(i)}\cdot\ldots\cdot n_k^{(i)}\right)
  conditions: podział na r rozłącznych przypadków, w każdym przypadku konstrukcja etapowa o stałych liczbach
    możliwości
  description: Najczęstszy schemat rozwiązania trudniejszego zadania na zliczanie.
methods:
- name: Podstawowy schemat zliczania regułą mnożenia
  when_to_use: Gdy każdy zliczany obiekt powstaje przez wykonanie ustalonej liczby kolejnych, niezależnych
    od siebie wyborów (kody, ustawienia, zestawy ubrań, trasy).
  steps:
  - Ustal dokładnie, CO zliczasz (jak wygląda pojedynczy obiekt) i kiedy dwa obiekty są różne.
  - Rozbij konstrukcję obiektu na etapy tak, aby ciąg wyborów jednoznacznie wyznaczał obiekt i każdy obiekt
    powstawał dokładnie raz.
  - Sprawdź, czy występują powtórzenia (czy element raz użyty może być użyty ponownie).
  - Dla każdego etapu podaj liczbę możliwości n_i, upewniając się, że nie zależy ona od konkretnych wcześniejszych
    wyborów.
  - 'Pomnóż: N = n₁·n₂·…·n_k.'
  - Sprawdź rząd wielkości wyniku (czy nie jest absurdalnie mały/duży) i zapisz odpowiedź.
- name: Metoda miejsc („kratek”) dla liczb o zadanych własnościach
  when_to_use: 'Zadania typu: ile jest liczb czterocyfrowych parzystych / o różnych cyfrach / podzielnych
    przez 5 / większych od danej liczby.'
  steps:
  - Narysuj tyle kratek, ile cyfr ma liczba.
  - Wypisz ograniczenia dla poszczególnych miejsc (pierwsza cyfra ≠ 0; ostatnia cyfra parzysta; cyfry
    różne itp.).
  - Zacznij wypełnianie od miejsca najbardziej ograniczonego, potem przechodź do kolejnych, uwzględniając
    już zużyte cyfry (jeśli mają być różne).
  - Jeśli liczba możliwości na którymś miejscu zależy od tego, co wybrano wcześniej (typowo przez cyfrę
    0), rozbij zadanie na rozłączne przypadki i policz każdy osobno.
  - Pomnóż liczby w kratkach w obrębie przypadku, a wyniki przypadków dodaj.
- name: Rozbicie na przypadki (reguła dodawania) i sumowanie
  when_to_use: Gdy warunek zadania obejmuje kilka wykluczających się scenariuszy albo gdy prosty iloczyn
    zawodzi z powodu zależności między etapami.
  steps:
  - Wybierz kryterium podziału, które jest rozstrzygalne dla każdego obiektu (np. wartość ostatniej cyfry,
    liczba wybranych dziewczyn, obecność zera).
  - 'Sprawdź rozłączność: żaden obiekt nie może pasować do dwóch przypadków.'
  - 'Sprawdź zupełność: każdy obiekt musi pasować do jakiegoś przypadku.'
  - W każdym przypadku policz obiekty regułą mnożenia.
  - Dodaj otrzymane liczby i zapisz odpowiedź.
- name: Metoda dopełnienia
  when_to_use: Gdy warunek brzmi „co najmniej jeden…”, „przynajmniej raz…”, „nie wszystkie…”, a bezpośredni
    podział na przypadki byłby długi.
  steps:
  - Policz liczbę WSZYSTKICH obiektów bez dodatkowego warunku (zwykle prosty iloczyn).
  - Sformułuj poprawne zaprzeczenie warunku (zaprzeczeniem „co najmniej jedna litera” jest „ani jednej
    litery”).
  - Policz obiekty spełniające zaprzeczenie — także regułą mnożenia.
  - 'Odejmij: wynik = wszystkie − niespełniające warunku.'
  - Sprawdź, czy oba zliczenia dotyczyły tego samego zbioru wyjściowego.
- name: Budowa i odczytanie drzewa możliwości
  when_to_use: Przy niewielkiej liczbie etapów i możliwości, gdy chcemy zobaczyć strukturę wyborów lub
    uzasadnić wynik; także jako kontrola poprawności iloczynu.
  steps:
  - Narysuj korzeń i krawędzie odpowiadające możliwym wyborom na pierwszym etapie.
  - Z każdego wierzchołka poprowadź krawędzie dla wyborów na następnym etapie, respektując ograniczenia
    (np. zużyte elementy).
  - Powtarzaj aż do ostatniego etapu; każda ścieżka korzeń–liść to jeden obiekt.
  - 'Policz liście: gdy rozgałęzienia są równoliczne — mnóż, gdy różnią się — sumuj liczby liści poszczególnych
    gałęzi.'
- name: Kontrola poprawności zliczenia
  when_to_use: Po każdym rozwiązaniu, zanim zapiszesz odpowiedź.
  steps:
  - Wskaż jeden konkretny obiekt i sprawdź, że Twoja konstrukcja tworzy go dokładnie raz (brak pominięć
    i brak podwójnego liczenia).
  - Sprawdź, czy nie policzyłeś obiektów niedozwolonych (np. liczby zaczynającej się od 0).
  - Porównaj wynik z prostym oszacowaniem (np. wynik musi być mniejszy niż liczba wszystkich liczb czterocyfrowych,
    czyli 9000).
  - Jeśli to możliwe, policz to samo drugim sposobem (np. dopełnieniem) i porównaj wyniki.
examples:
- statement: W szafie jest 5 koszul, 3 pary spodni i 2 pary butów. Ile różnych zestawów (koszula, spodnie,
    buty) można utworzyć? A ile jest sposobów wybrania jednej sztuki odzieży spośród tych wszystkich rzeczy?
  worked_solution: |-
    Część 1. Zestaw powstaje w trzech etapach: wybór koszuli (5 sposobów), potem spodni (3 sposoby), potem butów (2 sposoby). Liczby możliwości na kolejnych etapach nie zależą od wcześniejszych wyborów, więc stosujemy regułę mnożenia:
    N = 5·3·2 = 30.
    Jest 30 zestawów.

    Część 2. Teraz wybieramy TYLKO JEDNĄ rzecz: to koszula ALBO spodnie ALBO buty — przypadki są rozłączne (jedna rzecz nie jest jednocześnie koszulą i butem). Stosujemy regułę dodawania:
    N = 5 + 3 + 2 = 10.

    Wniosek: „i potem” (kilka etapów) → mnożymy; „albo” (rozłączne przypadki) → dodajemy.
  difficulty: 1
- statement: Ile jest liczb trzycyfrowych o wszystkich cyfrach różnych, w których zapisie występują tylko
    cyfry ze zbioru {1, 2, 3, 4, 5, 6}? Ile spośród nich jest nieparzystych?
  worked_solution: |-
    Część 1. Rysujemy trzy miejsca. Żadna cyfra ze zbioru nie jest zerem, więc pierwsze miejsce nie ma dodatkowego ograniczenia.
    – setki: 6 możliwości,
    – dziesiątki: 5 (jedna cyfra już zużyta),
    – jedności: 4.
    Reguła mnożenia: N = 6·5·4 = 120.

    Część 2. Warunek dotyczy ostatniego miejsca, więc je wypełniamy najpierw.
    – jedności: cyfra nieparzysta ze zbioru, czyli 1, 3, 5 → 3 możliwości,
    – setki: dowolna z pozostałych 5 cyfr → 5 możliwości,
    – dziesiątki: dowolna z pozostałych 4 → 4 możliwości.
    N = 3·5·4 = 60.

    Sprawdzenie: dokładnie połowa liczb z części 1., co jest zgodne z symetrią zbioru (3 cyfry parzyste i 3 nieparzyste). Odpowiedź: 120 i 60.
  difficulty: 2
- statement: Ile jest liczb czterocyfrowych parzystych o wszystkich cyfrach różnych?
  worked_solution: |-
    Ograniczenia: pierwsza cyfra ≠ 0, ostatnia cyfra ∈ {0, 2, 4, 6, 8}, wszystkie cyfry różne. Gdybyśmy zaczęli od ostatniego miejsca „na 5 sposobów”, to liczba możliwości dla pierwszego miejsca zależałaby od tego, czy wybrano 0, czy nie. Dlatego dzielimy zadanie na dwa rozłączne przypadki.

    Przypadek A: ostatnia cyfra to 0.
    – jedności: 1 sposób (zero),
    – tysiące: dowolna z pozostałych 9 cyfr (0 już zużyte, a i tak było zabronione) → 9,
    – setki: 8, dziesiątki: 7.
    A = 1·9·8·7 = 504.

    Przypadek B: ostatnia cyfra to 2, 4, 6 lub 8.
    – jedności: 4 sposoby,
    – tysiące: nie może być 0 ani cyfry użytej na końcu → 10 − 2 = 8 sposobów,
    – setki: pozostało 8 cyfr → 8,
    – dziesiątki: 7.
    B = 4·8·8·7 = 1792.

    Przypadki są rozłączne (ostatnia cyfra albo jest zerem, albo nie) i wyczerpują wszystkie możliwości, więc regułą dodawania:
    N = 504 + 1792 = 2296.

    Kontrola: wszystkich liczb czterocyfrowych o różnych cyfrach jest 9·9·8·7 = 4536, a 2296 to nieco ponad połowę — wynik wiarygodny (parzystych jest trochę więcej niż nieparzystych, bo cyfra 0 „pomaga” tylko na końcu).
  difficulty: 4
- statement: Hasło składa się z 5 znaków, z których każdy jest jedną z 26 małych liter alfabetu łacińskiego
    albo jedną z 10 cyfr; znaki mogą się powtarzać. Ile jest haseł zawierających co najmniej jedną cyfrę?
  worked_solution: |-
    Na każdym z 5 miejsc mamy do dyspozycji 26 + 10 = 36 znaków (litera ALBO cyfra — reguła dodawania w obrębie jednego miejsca).

    Wszystkich haseł (reguła mnożenia): 36^5.
    36^5 = 36·36·36·36·36 = 60 466 176.

    Zaprzeczenie warunku „co najmniej jedna cyfra” to „ani jednej cyfry”, czyli hasła złożone wyłącznie z liter: 26^5 = 11 881 376.

    Metoda dopełnienia:
    N = 36^5 − 26^5 = 60 466 176 − 11 881 376 = 48 584 800.

    Uwaga: nie wolno liczyć tego jako „5·10·36^4” (wybieram miejsce na cyfrę i resztę dowolnie), bo hasła z dwiema cyframi zostałyby policzone wielokrotnie.
  difficulty: 4
- statement: W klasie jest 12 dziewcząt i 8 chłopców. Wybieramy delegację złożoną z przewodniczącego i
    jego zastępcy (dwie różne osoby, funkcje są różne). Na ile sposobów można to zrobić, jeśli w delegacji
    mają być osoby tej samej płci?
  worked_solution: |-
    Dzielimy na dwa rozłączne przypadki: dwie dziewczyny ALBO dwaj chłopcy (delegacja nie może być jednocześnie obu typów).

    Przypadek A — dwie dziewczyny: wybieramy przewodniczącą (12 możliwości), a potem zastępczynię spośród pozostałych 11 (11 możliwości). Funkcje są różne, więc kolejność ma znaczenie:
    A = 12·11 = 132.

    Przypadek B — dwaj chłopcy: B = 8·7 = 56.

    Reguła dodawania: N = 132 + 56 = 188.

    Komentarz: gdyby funkcje nie były rozróżnione (po prostu „dwuosobowa delegacja”), każdą parę policzylibyśmy dwa razy i wynik wynosiłby (132 + 56) : 2 = 94. Zawsze sprawdzaj, czy kolejność (rola) ma znaczenie.
  difficulty: 3
objectives:
- statement: Sformułować regułę mnożenia i regułę dodawania oraz podać warunki, przy których każda z nich
    obowiązuje (etapowość i niezależność liczby możliwości; rozłączność i zupełność przypadków).
  bloom_level: Rozumienie
- statement: Rozstrzygnąć na podstawie treści zadania, czy dana sytuacja wymaga mnożenia, dodawania, czy
    obu reguł łącznie.
  bloom_level: Analiza
- statement: Zliczać obiekty powstające w wyniku dowolnej liczby kolejnych czynności, stosując regułę
    mnożenia (z powtórzeniami i bez powtórzeń).
  bloom_level: Zastosowanie
- statement: Budować i odczytywać drzewo możliwości dla konstrukcji dwu- i trzyetapowej oraz wiązać jego
    strukturę z regułą mnożenia i dodawania.
  bloom_level: Zastosowanie
- statement: Zliczać liczby naturalne o zadanych własnościach (dana liczba cyfr, cyfry różne lub powtarzające
    się, parzystość, podzielność przez 5 lub 10, cyfry z danego zbioru) metodą miejsc, uwzględniając zakaz
    zera na pierwszym miejscu.
  bloom_level: Zastosowanie
- statement: Dobrać poprawne, rozłączne i wyczerpujące kryterium podziału na przypadki, policzyć każdy
    przypadek regułą mnożenia i zsumować wyniki.
  bloom_level: Analiza
- statement: Stosować metodę dopełnienia do zliczania obiektów spełniających warunek typu „co najmniej
    jeden”, poprawnie formułując zaprzeczenie warunku.
  bloom_level: Zastosowanie
- statement: 'Oceniać poprawność cudzego lub własnego zliczenia: wskazywać podwójne liczenie, pominięcia
    oraz niedozwolone obiekty i korygować rozwiązanie.'
  bloom_level: Ocena
- statement: Rozpoznać, czy w danym zadaniu kolejność wyborów ma znaczenie, i uwzględnić to w obliczeniach.
  bloom_level: Analiza
- statement: 'Zapisać rozwiązanie zadania na zliczanie w formie czytelnego uzasadnienia: opis etapów lub
    przypadków, rachunek, odpowiedź.'
  bloom_level: Tworzenie
misconceptions:
- name: Mylenie „i” z „albo” — dodawanie zamiast mnożenia
  incorrect_reasoning: „Mam 5 koszul, 3 spodnie i 2 pary butów, więc zestawów jest 5 + 3 + 2 = 10.”
  correct_reasoning: 'Zestaw wymaga wykonania trzech czynności jedna po drugiej, więc stosujemy regułę
    mnożenia: 5·3·2 = 30. Dodawanie stosujemy tylko wtedy, gdy obiekt należy do jednego z rozłącznych
    przypadków (np. gdy wybieramy tylko jedną rzecz).'
  severity: 5
- name: Mnożenie liczb rozłącznych przypadków
  incorrect_reasoning: „Liczba jest parzysta, gdy kończy się zerem lub cyfrą 2, 4, 6, 8 — więc mnożę wyniki
    obu przypadków.”
  correct_reasoning: Przypadki „kończy się 0” i „kończy się 2, 4, 6, 8” to alternatywy wykluczające się;
    liczby obiektów w nich dodajemy, a nie mnożymy. Mnożymy tylko etapy jednej konstrukcji.
  severity: 5
- name: Zapominanie, że pierwsza cyfra liczby nie może być zerem
  incorrect_reasoning: „Liczb czterocyfrowych o różnych cyfrach jest 10·9·8·7 = 5040.”
  correct_reasoning: 'Zapis 0123 nie jest liczbą czterocyfrową. Na pierwszym miejscu mamy 9 możliwości
    (1–9), a na drugim znowu 9 (pozostałe 9 cyfr, w tym 0): 9·9·8·7 = 4536.'
  severity: 5
- name: Rozpoczynanie wypełniania miejsc od lewej, mimo ograniczenia na ostatnim miejscu
  incorrect_reasoning: '„Liczby czterocyfrowe parzyste o różnych cyfrach: 9·8·7·5 — najpierw tysiące,
    a na końcu 5 cyfr parzystych.”'
  correct_reasoning: Po wybraniu trzech pierwszych cyfr liczba dostępnych cyfr parzystych na końcu zależy
    od tego, ile parzystych już zużyto — nie jest stała, więc reguła mnożenia w tej kolejności nie działa.
    Trzeba zacząć od miejsca najbardziej ograniczonego i rozbić zadanie na przypadki (ostatnia cyfra 0
    / ostatnia cyfra 2,4,6,8).
  severity: 4
- name: Nierozłączne przypadki — podwójne liczenie
  incorrect_reasoning: „Liczb, w których występuje cyfra 5 lub cyfra 7, jest tyle co z piątką plus tyle
    co z siódemką.”
  correct_reasoning: Liczby zawierające obie cyfry zostałyby policzone dwukrotnie. Przy podziale na przypadki
    trzeba zagwarantować, że każdy obiekt pasuje do dokładnie jednego przypadku (np. dzieląc według „zawiera
    5 / nie zawiera 5, ale zawiera 7”), albo policzyć zadanie dopełnieniem.
  severity: 4
- name: Błędne zliczanie warunku „co najmniej jeden” metodą „wybieram miejsce”
  incorrect_reasoning: '„Haseł 5-znakowych z co najmniej jedną cyfrą jest 5·10·36⁴: wybieram miejsce na
    cyfrę, cyfrę i resztę znaków dowolnie.”'
  correct_reasoning: 'Hasło z dwiema cyframi zostaje policzone kilka razy (raz dla każdej z jego cyfr).
    Poprawnie: wszystkie hasła minus hasła bez cyfr, czyli 36⁵ − 26⁵.'
  severity: 4
- name: Nieprawidłowe zaprzeczenie warunku przy dopełnieniu
  incorrect_reasoning: „Zaprzeczeniem warunku »co najmniej jedna cyfra« jest »dokładnie jedna cyfra« (albo
    »same cyfry«).”
  correct_reasoning: Zaprzeczeniem „co najmniej jedna” jest „ani jednej” (zero cyfr). Przed odjęciem zawsze
    sformułuj zaprzeczenie w pełnym zdaniu i sprawdź na przykładzie.
  severity: 4
- name: Ignorowanie informacji o powtórzeniach
  incorrect_reasoning: „Kodów PIN o czterech cyfrach jest 10·9·8·7, bo cyfry się zmniejszają.”
  correct_reasoning: 'Jeśli treść nie zabrania powtórzeń, cyfry mogą się powtarzać: 10⁴ = 10000. Malejące
    czynniki stosujemy tylko wtedy, gdy w zadaniu jest mowa o różnych elementach (np. „o różnych cyfrach”,
    „bez zwracania”).'
  severity: 4
- name: Nieuwzględnianie roli kolejności
  incorrect_reasoning: '„Wybór dwóch osób z 12 do dwuosobowej delegacji: 12·11 = 132.”'
  correct_reasoning: 'Jeśli osoby nie mają różnych funkcji, para {Ala, Basia} została policzona dwa razy
    (Ala–Basia i Basia–Ala). Wynik to 132 : 2 = 66. Gdy funkcje są różne (przewodniczący, zastępca), poprawne
    jest 132.'
  severity: 3
- name: Mnożenie przez liczbę możliwości, która zależy od wcześniejszego wyboru
  incorrect_reasoning: „Na pierwszym miejscu 5 możliwości, na drugim raz 3, raz 4 — wezmę średnio 3,5
    i pomnożę.”
  correct_reasoning: Reguła mnożenia wymaga STAŁEJ liczby możliwości na każdym etapie. Jeśli liczba ta
    zależy od wcześniejszego wyboru, należy rozbić zliczanie na przypadki według tego wyboru i sumy iloczynów
    dodać.
  severity: 4
