name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # conftest requires "test" in the db name; it creates zaspro_test itself.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/zaspro_test

    steps:
      - uses: actions/checkout@v4

      - name: Install TeX (for the curriculum statement_latex compile test)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - run: uv sync --frozen

      - name: Tests (includes the migration/model drift check)
        run: uv run pytest -q
